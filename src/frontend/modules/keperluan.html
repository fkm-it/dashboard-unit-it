<style>
.bm-wrap { width: min(860px, 100%); margin: 0 auto; padding: var(--sp-6) var(--sp-4) var(--sp-10); }
.bm-card { background: var(--white); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--sp-6); box-shadow: var(--shadow-lift); }
.bm-head h1 { font-size: var(--fs-2xl); margin: var(--sp-2) 0; }
.bm-sec { border-top: 1px solid var(--line); padding-top: var(--sp-5); margin-top: var(--sp-5); }
.bm-sec > h2 { font-size: var(--fs-lg); margin-bottom: var(--sp-1); display: flex; gap: 10px; align-items: center; }
.bm-sec > p { margin-bottom: var(--sp-4); }
.bm-num { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--brand); color: #fff; font-size: var(--fs-sm); font-weight: 700; flex: none; }
.bm-calc { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--sp-3); margin-top: var(--sp-4); }
.bm-calc div { background: var(--canvas-200); border-radius: var(--r-md); padding: 10px 12px; min-width: 0; }
.bm-calc b { display: block; font-size: var(--fs-xl); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bm-warn { color: var(--danger); font-weight: 600; }
.bm-status { border-radius: var(--r-md); padding: 12px 14px; margin-top: var(--sp-4); background: var(--canvas-200); }
.bm-status.is-warn { background: #FEF3C7; }
.bm-status.is-ok { background: #DCFCE7; }
.bm-ro { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-3); }
.bm-ro dt { font-size: var(--fs-xs); color: var(--muted); }
.bm-ro dd { margin: 0; font-weight: 600; }
.bm-share { display: flex; gap: var(--sp-2); }
.bm-share .input { flex: 1; min-width: 0; font-size: var(--fs-sm); }
@media (max-width: 640px) {
  .bm-wrap { padding: var(--sp-4) var(--sp-3) var(--sp-8); }
  .bm-card { padding: var(--sp-5) var(--sp-4); }
  .bm-calc { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .bm-calc div:last-child { grid-column: 1 / -1; }
  .bm-ro { grid-template-columns: minmax(0, 1fr); }
  .bm-share { flex-direction: column; }
}
</style>
<script>
/**
 * Borang awam Banci & Keperluan Komputer Makmal (#/banci-makmal) — link dikongsi kepada pemilik / pengurus makmal.
 *   #/banci-makmal          → borang baharu (tanpa log masuk)
 *   #/banci-makmal?t=TOKEN  → lihat / kemas kini borang melalui link peribadi yang diemel
 * Admin: butang "Kongsi link borang" di senarai Keperluan Makmal.
 */
(function (KD) {
  'use strict';
  const { html, raw, qs, on, fmtNum } = KD.utils;
  const { icon, toast, toastError, errorState, skeletonList, busy, fieldErrors, modal } = KD.ui;
  const NEW = '__baru';
  const rm = (n) => 'RM ' + Number(n || 0).toLocaleString('ms-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  const SECTIONS = [
    { n: 1, title: 'Maklumat pemohon', note: 'Pemilik, ketua atau pengurus makmal.', keys: ['namaPemohon', 'noStaf', 'emailPemohon', 'peranan', 'telefonPemohon'] },
    { n: 2, title: 'Makmal', note: 'Satu borang bagi setiap makmal bagi setiap tahun.', keys: ['tahun', 'makmal', 'namaMakmalBaru', 'bangunanMakmalBaru', 'bilikMakmalBaru', 'jabatanMakmalBaru'] },
    { n: 3, title: 'Banci komputer sedia ada', note: 'Berfungsi + rosak (boleh dibaiki) + rosak (tidak ekonomi) mesti sama dengan jumlah sedia ada. Makmal baharu: isi 0.', keys: ['jumlahSediaAda', 'berfungsi', 'tidakSesuai', 'rosakBolehBaiki', 'rosakLupus'] },
    { n: 4, title: 'Permohonan penggantian / penambahan', note: 'Pilih jenis permohonan. Bilangan penggantian, penambahan dan anggaran kos dikira automatik dan direkod berasingan.', keys: ['jenisPermohonan', 'sasaranJumlah', 'keutamaan', 'hargaSeunit', 'sumberHarga', 'spesifikasi', 'perisian', 'justifikasi'] }
  ];
  const NEW_KEYS = ['namaMakmalBaru', 'bangunanMakmalBaru', 'bilikMakmalBaru', 'jabatanMakmalBaru'];
  const PUB_REQ = ['namaPemohon', 'noStaf', 'emailPemohon', 'peranan', 'jenisPermohonan'];

  const num = (form, k) => { const e = form.elements[k]; const n = Number(e && e.value); return isFinite(n) ? n : 0; };

  const JENIS = { GANTI: 'Penggantian sahaja', TAMBAH: 'Penambahan sahaja', GANTI_TAMBAH: 'Penggantian dan penambahan', TIADA: 'Tiada permohonan' };
  const jenisOf = (form) => (form.elements.jenisPermohonan && form.elements.jenisPermohonan.value) || '';

  function compute(form) {
    const n = { sedia: num(form, 'jumlahSediaAda'), berfungsi: num(form, 'berfungsi'), tidakSesuai: num(form, 'tidakSesuai'), baiki: num(form, 'rosakBolehBaiki'), lupus: num(form, 'rosakLupus'), sasaran: num(form, 'sasaranJumlah'), harga: num(form, 'hargaSeunit') };
    const j = jenisOf(form);
    const kekal = n.berfungsi - n.tidakSesuai + n.baiki;
    const gantiCalon = n.tidakSesuai + n.lupus;
    const tambahCalon = Math.max(0, n.sasaran - kekal - gantiCalon);
    const ganti = j === 'GANTI' || j === 'GANTI_TAMBAH' ? gantiCalon : 0;
    const tambahan = j === 'TAMBAH' || j === 'GANTI_TAMBAH' ? tambahCalon : 0;
    return { n, j, kekal, gantiCalon, tambahCalon, ganti, tambahan, kosGanti: ganti * n.harga, kosTambahan: tambahan * n.harga, sumOk: n.berfungsi + n.baiki + n.lupus === n.sedia, sesuaiOk: n.tidakSesuai <= n.berfungsi };
  }

  function calcBox(c) {
    const warn = [];
    if ((c.j === 'GANTI' || c.j === 'GANTI_TAMBAH') && c.gantiCalon < 1) warn.push('Tiada komputer untuk diganti — isi bilangan "tidak lagi sesuai" atau "rosak tidak ekonomi", atau pilih jenis lain.');
    if ((c.j === 'TAMBAH' || c.j === 'GANTI_TAMBAH') && c.tambahCalon < 1) warn.push('Untuk penambahan, jumlah diperlukan mesti melebihi ' + fmtNum(c.kekal + c.gantiCalon) + '.');
    return html`<div class="bm-calc" aria-live="polite">
      <div><span class="xs muted">Dikekalkan</span><b>${fmtNum(Math.max(0, c.kekal))}</b></div>
      <div><span class="xs muted">Penggantian</span><b>${fmtNum(c.ganti)}</b>${c.n.harga && c.ganti ? html`<span class="xs muted">${rm(c.kosGanti)}</span>` : ''}</div>
      <div><span class="xs muted">Penambahan</span><b>${fmtNum(c.tambahan)}</b>${c.n.harga && c.tambahan ? html`<span class="xs muted">${rm(c.kosTambahan)}</span>` : ''}</div>
      <div><span class="xs muted">Jumlah anggaran kos</span><b>${c.n.harga ? rm(c.kosGanti + c.kosTambahan) : '—'}</b></div></div>
      ${!c.j ? html`<p class="small muted mt-2">Pilih jenis permohonan untuk melihat kiraan.</p>` : ''}
      ${warn.map((w) => html`<p class="small bm-warn mt-2">${w}</p>`)}
      ${!c.sumOk ? html`<p class="small bm-warn mt-2">Berfungsi (${fmtNum(c.n.berfungsi)}) + rosak boleh dibaiki (${fmtNum(c.n.baiki)}) + rosak tidak ekonomi (${fmtNum(c.n.lupus)}) = ${fmtNum(c.n.berfungsi + c.n.baiki + c.n.lupus)}, tidak sama dengan jumlah sedia ada (${fmtNum(c.n.sedia)}).</p>` : ''}
      ${!c.sesuaiOk ? html`<p class="small bm-warn mt-2">"Tidak lagi sesuai" tidak boleh melebihi bilangan berfungsi.</p>` : ''}`;
  }

  function labSelect(f, opts, value, isNew) {
    return html`<div class="field field-wide"><label class="label" for="bm-makmal">${f.label}</label>
      <select class="select" id="bm-makmal" name="makmal"><option value="">— Pilih makmal —</option>${opts.map((o) => html`<option value="${o.value}" ${value === o.value ? raw('selected') : ''}>${o.label}${o.hint ? ' — ' + o.hint : ''}</option>`)}
      <option value="${NEW}" ${isNew ? raw('selected') : ''}>+ Makmal baharu / tiada dalam senarai</option></select><span class="hint">${f.hint || ''}</span></div>`;
  }

  /** Bina borang ikut seksyen. mode: 'create' | 'edit' */
  function formHtml(m, refOptions, values, mode, meta) {
    const byKey = {};
    m.fields.forEach((f) => { byKey[f.key] = f; });
    const v = values || {};
    const isNew = mode === 'edit' ? !v.makmal : false;
    const field = (k) => {
      const f = byKey[k];
      if (!f) return '';
      if (mode === 'edit' && (k === 'tahun' || k === 'makmal' || k === 'emailPemohon' || k === 'namaMakmalBaru')) return '';
      if (k === 'makmal') return labSelect(f, (refOptions && refOptions.makmal) || [], (meta && meta.preLab) || KD.crud.prefill(f) || '', false);
      const ff = NEW_KEYS.indexOf(k) >= 0 ? Object.assign({}, f, { required: k === 'namaMakmalBaru' }) : PUB_REQ.indexOf(k) >= 0 ? Object.assign({}, f, { required: true, hint: (f.hint || '').replace(/\s*Wajib dalam borang awam\.?/, '') }) : f;
      const inp = KD.crud.fieldInput(ff, { value: mode === 'edit' ? v[k] : KD.crud.prefill(f), idPrefix: 'bm-', refOptions });
      return NEW_KEYS.indexOf(k) >= 0 ? html`<div data-new-lab ${mode === 'edit' && isNew ? '' : raw('hidden')} class="${k === 'namaMakmalBaru' ? 'field-wide' : ''}">${inp}</div>` : inp;
    };
    return html`${SECTIONS.map((s) => html`<section class="bm-sec"><h2><span class="bm-num">${s.n}</span>${s.title}</h2><p class="small muted">${s.note}</p>
        ${mode === 'edit' && s.n === 2 ? html`<dl class="bm-ro mb-4"><div><dt>Makmal</dt><dd>${meta.namaMakmal}</dd></div><div><dt>Tahun</dt><dd>${v.tahun}</dd></div></dl>` : ''}
        ${mode === 'edit' && s.n === 1 ? html`<dl class="bm-ro mb-4"><div><dt>Email (link dihantar ke sini)</dt><dd>${v.emailPemohon}</dd></div></dl>` : ''}
        <div class="form-grid">${s.keys.map(field)}</div>
        ${s.n === 4 ? html`<div data-calc></div>` : ''}</section>`)}`;
  }

  function bindCalc(form) {
    const sas = form.elements.sasaranJumlah && form.elements.sasaranJumlah.closest('.field');
    const draw = () => {
      const c = compute(form);
      qs('[data-calc]', form).innerHTML = calcBox(c).s;
      /* Jumlah diperlukan hanya relevan untuk penambahan */
      if (sas) sas.style.display = c.j === 'TAMBAH' || c.j === 'GANTI_TAMBAH' ? '' : 'none';
    };
    on(form, 'input', 'input', draw);
    on(form, 'change', 'select', draw);
    draw();
    const sel = form.elements.makmal;
    if (sel && sel.tagName === 'SELECT') {
      const toggle = () => { form.querySelectorAll('[data-new-lab]').forEach((x) => { x.hidden = sel.value !== NEW; }); };
      sel.addEventListener('change', toggle);
      toggle();
    }
  }

  function shell(el, inner) {
    el.innerHTML = html`${KD.views.publicTop ? KD.views.publicTop() : ''}<div class="bm-wrap">${inner}</div>`.s;
  }

  function resendBox() {
    return html`<details class="mt-6"><summary class="small" style="cursor:pointer">Sudah hantar borang dan perlu kemas kini? Dapatkan semula link</summary>
      <form class="mt-4" data-resend novalidate><div class="form-grid">
        <div class="field"><label class="label" for="rs-ref">No. rujukan</label><input class="input" id="rs-ref" name="refNo" required maxlength="40" placeholder="cth. KPM-2026-001"></div>
        <div class="field"><label class="label" for="rs-email">Email pemohon</label><input class="input" id="rs-email" name="email" type="email" required autocomplete="email"></div></div>
        <button class="btn btn-outline mt-4" type="submit">${icon('mail')}Hantar link ke email</button></form></details>`;
  }

  function bindResend(el) {
    on(el, 'submit', '[data-resend]', (e, f) => {
      e.preventDefault();
      busy(qs('button[type="submit"]', f), async () => {
        try {
          const r = await KD.api.call('keperluan.awamPautan', { refNo: f.refNo.value.trim(), email: f.email.value.trim() });
          toast(r.message);
        } catch (err) { if (!fieldErrors(f, err)) toastError(err); }
      });
    });
  }

  KD.views.banciMakmal = {
    async render(el, params, query) {
      shell(el, html`<div class="bm-card">${skeletonList(3)}</div>`);
      const token = query && query.t;
      let meta;
      try { meta = await KD.api.publicForm('keperluan'); } catch (err) { shell(el, html`<div class="bm-card">${errorState(err)}</div>`); return; }
      const m = meta.module;
      const pf = m.publicForm || {};
      if (token) return renderEdit(el, m, meta, token);

      shell(el, html`<div class="bm-card"><div class="bm-head">${icon('briefcase', 'i-lg')}<h1>${pf.title || m.label}</h1><p class="muted">${pf.intro || ''}</p></div>
        <form data-bm novalidate>${formHtml(m, meta.refOptions, null, 'create', { preLab: query && query.makmal })}
          <div class="sr-only" aria-hidden="true"><label>Laman web<input name="website" tabindex="-1" autocomplete="off"></label></div>
          <button class="btn btn-primary btn-block mt-6" type="submit">${icon('send')}Hantar borang</button></form>
        ${resendBox()}</div>`);
      const form = qs('[data-bm]', el);
      bindCalc(form);
      bindResend(el);
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        busy(qs('button[type="submit"]', form), async () => {
          try {
            const p = await KD.crud.collect(form, m.fields.filter((f) => f.type !== 'files'), null);
            if (p.makmal === NEW) p.makmal = ''; else NEW_KEYS.forEach((k) => { p[k] = ''; });
            p.formToken = meta.formToken;
            p.website = form.elements.website.value;
            const res = await KD.api.publicCreate('keperluan', p);
            shell(el, html`<div class="bm-card success-card">${icon('check', 'i-lg')}<h2>Borang dihantar</h2><p class="muted">${pf.successMessage || ''}</p>
              ${res.refNo ? html`<div class="rec-ref">${res.refNo}</div><p class="xs muted mt-2">Simpan nombor rujukan ini. Semak folder spam jika email tidak diterima.</p>` : ''}
              <div class="row row-wrap mt-6" style="justify-content:center"><a class="btn btn-outline" href="#/banci-makmal" data-again>Isi borang makmal lain</a></div></div>`);
            on(el, 'click', '[data-again]', (ev) => { ev.preventDefault(); KD.router.render(); });
          } catch (err) {
            if (!fieldErrors(form, err)) toastError(err);
            if (err.code === 'VALIDATION_ERROR' && /tamat tempoh|terlalu cepat/.test(err.message)) {
              try { meta.formToken = (await KD.api.publicForm('keperluan')).formToken; } catch (e2) { /* abaikan */ }
            }
          }
        });
      });
    }
  };

  async function renderEdit(el, m, meta, token) {
    let d;
    try { d = await KD.api.call('keperluan.awamGet', { t: token }); } catch (err) {
      shell(el, html`<div class="bm-card"><h2>Link tidak sah atau telah tamat</h2><p class="muted mt-2">Link ini mungkin telah diganti dengan link baharu, atau borang telah diproses oleh Unit IT. Minta link baharu di bawah.</p>${resendBox()}</div>`);
      bindResend(el);
      return;
    }
    const tone = d.status === 'DIKEMBALIKAN' ? 'is-warn' : d.status === 'DISAHKAN' ? 'is-ok' : '';
    const statusBox = html`<div class="bm-status ${tone}"><b>Status: ${d.statusLabel}</b>${d.statusNote ? html`<div class="small mt-1">Catatan Unit IT: ${d.statusNote}</div>` : ''}${d.catatanIt ? html`<div class="small mt-1">${d.catatanIt}</div>` : ''}</div>`;
    if (!d.canEdit) {
      const v = d.values;
      shell(el, html`<div class="bm-card"><div class="bm-head">${icon('briefcase', 'i-lg')}<h1>Borang ${d.refNo}</h1><p class="muted">${d.namaMakmal} · tahun ${v.tahun}</p></div>${statusBox}
        <section class="bm-sec"><dl class="bm-ro">
          <div><dt>Jumlah sedia ada</dt><dd>${fmtNum(v.jumlahSediaAda)}</dd></div><div><dt>Jumlah diperlukan</dt><dd>${fmtNum(v.sasaranJumlah)}</dd></div>
          <div><dt>Jenis permohonan</dt><dd>${JENIS[d.computed.jenis] || '—'}</dd></div><div></div>
          <div><dt>Penggantian</dt><dd>${fmtNum(d.computed.ganti)} · ${rm(d.computed.kosGanti)}</dd></div><div><dt>Penambahan</dt><dd>${fmtNum(d.computed.tambahan)} · ${rm(d.computed.kosTambahan)}</dd></div>
          <div><dt>Jumlah anggaran kos</dt><dd>${rm(d.computed.kos)}</dd></div></dl>
          <p class="small muted mt-4">Borang ini telah diproses dan tidak boleh dikemas kini lagi. Hubungi Unit IT FKM untuk sebarang pindaan.</p></section></div>`);
      return;
    }
    shell(el, html`<div class="bm-card"><div class="bm-head">${icon('briefcase', 'i-lg')}<h1>Kemas kini borang ${d.refNo}</h1><p class="muted">${d.namaMakmal} · tahun ${d.values.tahun}. Link ini peribadi; jangan kongsikan.</p></div>${statusBox}
      <form data-bm novalidate>${formHtml(m, meta.refOptions, d.values, 'edit', d)}
        <button class="btn btn-primary btn-block mt-6" type="submit">${icon('check')}${d.status === 'DIKEMBALIKAN' ? 'Simpan & hantar semula' : 'Simpan perubahan'}</button></form></div>`);
    const form = qs('[data-bm]', el);
    bindCalc(form);
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      busy(qs('button[type="submit"]', form), async () => {
        try {
          const skip = ['tahun', 'makmal', 'emailPemohon', 'namaMakmalBaru'];
          const p = await KD.crud.collect(form, m.fields.filter((f) => f.type !== 'files' && skip.indexOf(f.key) < 0), null);
          p.t = token;
          await KD.api.call('keperluan.awamKemaskini', p);
          toast('Borang dikemas kini.');
          KD.router.render();
        } catch (err) { if (!fieldErrors(form, err)) toastError(err); }
      });
    });
  }

  /* Admin: kongsi link borang dari senarai Keperluan Makmal */
  KD.listActions.keperluan = {
    render: () => html`<button class="btn btn-outline" data-list-act="rumusan">${icon('chart')}Rumusan fakulti</button><button class="btn btn-outline" data-list-act="banci">${icon('users')}Status banci & hantar link</button><button class="btn btn-outline" data-list-act="kongsi">${icon('share')}Kongsi link borang</button>`,
    run: async (act, b) => {
      if (act === 'banci') return censusModal(b);
      if (act === 'rumusan') return summaryModal(b);
      let url = '';
      try { url = (await KD.api.call('keperluan.pautanBorang', {})).url; } catch (err) { toastError(err); return; }
      if (!/^https?:/.test(url)) url = location.href.split('#')[0] + '#/banci-makmal';
      const md = modal({
        title: 'Link borang banci makmal',
        body: html`<p class="small">Kongsikan link ini kepada pemilik / ketua / pengurus makmal (email, WhatsApp). Mereka tidak perlu log masuk; setiap pemohon menerima link peribadi melalui email untuk mengemas kini borang sehingga disahkan.</p>
          <div class="bm-share mt-4"><input class="input" readonly value="${url}" data-url aria-label="Link borang"><button class="btn btn-primary" data-copy>${icon('copy')}Salin</button></div>
          <p class="xs muted mt-2">Email pemohon mesti dalam domain dibenarkan (Tetapan → KEPERLUAN_DOMAIN_EMAIL). Borang awam boleh ditutup sementara melalui Tetapan → Benarkan borang awam.</p>`,
        foot: html`<a class="btn btn-outline" href="${url}" target="_blank" rel="noopener">${icon('eye')}Buka borang</a><button class="btn btn-ghost" data-close>Tutup</button>`
      });
      on(md.el, 'click', '[data-copy]', async () => {
        const inp = qs('[data-url]', md.el);
        try { await navigator.clipboard.writeText(inp.value); } catch (e) { inp.select(); document.execCommand('copy'); }
        toast('Link disalin.');
      });
    }
  };

  /* Rumusan keperluan seluruh fakulti — penggantian & penambahan berasingan */
  function summaryTable(r) {
    const s = r.jumlah.semua, d = r.jumlah.disahkan;
    return html`<div class="im-scroll"><table class="xo-table" style="min-width:0"><thead><tr><th></th><th class="num">Makmal</th><th class="num">Penggantian</th><th class="num">Kos ganti</th><th class="num">Penambahan</th><th class="num">Kos tambah</th><th class="num">Jumlah kos</th></tr></thead><tbody>
      <tr><td>Semua permohonan</td><td class="num">${fmtNum(s.makmal)}</td><td class="num"><b>${fmtNum(s.ganti)}</b></td><td class="num">${rm(s.kosGanti)}</td><td class="num"><b>${fmtNum(s.tambahan)}</b></td><td class="num">${rm(s.kosTambahan)}</td><td class="num">${rm(s.kos)}</td></tr>
      <tr><td>Disahkan Unit IT</td><td class="num">${fmtNum(d.makmal)}</td><td class="num">${fmtNum(d.ganti)}</td><td class="num">${rm(d.kosGanti)}</td><td class="num">${fmtNum(d.tambahan)}</td><td class="num">${rm(d.kosTambahan)}</td><td class="num">${rm(d.kos)}</td></tr></tbody></table></div>`;
  }

  async function summaryModal(btn) {
    let r;
    try { r = await busy(btn, () => KD.api.call('keperluan.rumusan', {})); } catch (err) { toastError(err); return; }
    if (!r) return;
    const md = modal({
      title: 'Rumusan keperluan ICT makmal ' + r.tahun,
      body: html`${summaryTable(r)}
        <div class="label mt-4">Ikut jenis permohonan</div>
        <div class="im-scroll mt-2"><table class="xo-table" style="min-width:0"><thead><tr><th>Jenis</th><th class="num">Makmal</th><th class="num">Ganti</th><th class="num">Tambah</th></tr></thead>
        <tbody>${r.ikutJenis.map((j) => html`<tr><td>${j.label}</td><td class="num">${fmtNum(j.makmal)}</td><td class="num">${fmtNum(j.ganti)}</td><td class="num">${fmtNum(j.tambahan)}</td></tr>`)}</tbody></table></div>
        <div class="label mt-4">Ikut makmal</div>
        <div class="im-scroll mt-2" style="max-height:38vh;overflow:auto"><table class="xo-table" style="min-width:560px"><thead><tr><th>Makmal</th><th>Jenis</th><th class="num">Ganti</th><th class="num">Tambah</th><th class="num">Kos (RM)</th></tr></thead>
        <tbody>${r.items.map((i) => html`<tr><td>${i.makmal}<div class="xs muted">${i.refNo}</div></td><td class="small">${i.jenisLabel}</td><td class="num">${fmtNum(i.ganti)}</td><td class="num">${fmtNum(i.tambahan)}</td><td class="num">${fmtNum(i.kosGanti + i.kosTambahan)}</td></tr>`)}</tbody></table></div>
        <p class="xs muted mt-2">Permohonan Ditolak tidak dikira. Kos ikut anggaran harga seunit yang diisi pemohon.</p>`,
      foot: html`<button class="btn btn-outline" data-csv>${icon('download')}Eksport CSV</button><button class="btn btn-ghost" data-close>Tutup</button>`
    });
    on(md.el, 'click', '[data-csv]', () => {
      const rows = [['No. rujukan', 'Makmal', 'Jenis permohonan', 'Penggantian', 'Kos penggantian (RM)', 'Penambahan', 'Kos penambahan (RM)', 'Keutamaan', 'Status']]
        .concat(r.items.map((i) => [i.refNo, i.makmal, i.jenisLabel, i.ganti, i.kosGanti, i.tambahan, i.kosTambahan, i.keutamaan, i.status]));
      KD.utils.downloadText(KD.utils.toCsv(rows), 'text/csv', 'rumusan-keperluan-ict-makmal-' + r.tahun + '.csv');
    });
  }
  KD.keperluanSummaryTable = summaryTable;

  /* Admin: status banci tahun semasa bagi setiap makmal + emel link kepada staf makmal yang belum hantar */
  async function censusModal(btn) {
    let st;
    try { st = await busy(btn, () => KD.api.call('keperluan.statusBanci', {})); } catch (err) { toastError(err); return; }
    if (!st) return;
    const md = modal({
      title: 'Status banci makmal ' + st.tahun,
      body: html`<p class="small"><b>${fmtNum(st.dihantar)}</b> daripada ${fmtNum(st.jumlah)} makmal telah menghantar borang. ${st.belum ? html`<b>${fmtNum(st.belum)}</b> belum${st.unitIt ? html`, termasuk ${fmtNum(st.unitIt)} makmal komputer yang diisi oleh Unit IT` : ''}${st.tanpaPenerima ? html`; ${fmtNum(st.tanpaPenerima)} tiada staf/email` : ''}.` : ''}</p>
        <div class="im-scroll mt-2" style="max-height:46vh;overflow:auto"><table class="xo-table" style="min-width:0"><thead><tr><th>Makmal</th><th>Borang</th><th class="num">Penerima</th></tr></thead>
        <tbody>${st.items.map((i) => html`<tr><td>${i.label}</td><td>${i.dihantar ? html`<span style="color:var(--success);font-weight:600">${i.refNo}</span>` : html`<span class="muted">Belum</span>`}</td><td class="num">${i.unitIt ? html`<span class="muted">Unit IT</span>` : i.penerima ? fmtNum(i.penerima) : html`<span style="color:var(--warn)">0</span>`}</td></tr>`)}</tbody></table></div>
        <p class="xs muted mt-2">Penerima = staf makmal aktif dengan email (menu Staf Makmal); jika tiada, email penyelaras makmal. Link dalam email memilih makmal secara automatik.</p>`,
      foot: html`<button class="btn btn-outline" data-cs="ujian">${icon('mail')}Ujian kepada saya</button><button class="btn btn-primary" data-cs="hantar" ${st.bolehEmel ? '' : raw('disabled')}>${icon('send')}Emel ${fmtNum(st.bolehEmel)} makmal belum hantar</button>`
    });
    on(md.el, 'click', '[data-cs]', (e, b2) => busy(b2, async () => {
      try {
        const r = await KD.api.call('keperluan.emelBanci', { ujian: b2.getAttribute('data-cs') === 'ujian' });
        toast(r.ujian ? (r.dihantar ? 'Email ujian dihantar kepada anda.' : 'Email tidak dapat dihantar.') : 'Link diemel kepada ' + fmtNum(r.dihantar) + ' staf (' + fmtNum(r.makmal) + ' makmal).');
        if (!r.ujian) md.close();
      } catch (err) { toastError(err); }
    }));
  }

  KD.extraRoutes.push({ path: '/banci-makmal', view: 'banciMakmal', access: 'public', layout: 'public', title: 'Penilaian Keperluan ICT Makmal' });
  KD.publicFormPath = Object.assign(KD.publicFormPath || {}, { keperluan: '/banci-makmal' });
})(window.KD);
</script>
