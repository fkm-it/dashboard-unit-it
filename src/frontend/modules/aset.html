  // ================================================================ Import aset (/admin/import-aset)
  /** Penghurai CSV ringkas (RFC 4180): petikan, koma/koma bertitik, BOM. */
  function parseCsv(text) {
    text = String(text || '').replace(/^﻿/, '');
    const firstLine = text.split(/\r?\n/)[0] || '';
    const delim = (firstLine.split(';').length > firstLine.split(',').length) ? ';' : ',';
    const rows = [];
    let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += ch;
      } else if (ch === '"') q = true;
      else if (ch === delim) { row.push(cell); cell = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i + 1] === '\n') i++;
        row.push(cell); rows.push(row); row = []; cell = '';
      } else cell += ch;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows.filter((r) => r.some((c) => String(c).trim() !== ''));
  }

  /* Lajur eksport UTMFin / senarai DATA PC (KEWPA) → medan sistem */
  const UTMFIN = {
    BAR_CODE: 'noAset', SIRI_PRODUK: 'noSiri', ITEM_ASSET: 'model', DESKRIPSI_PEROLEHAN: 'deskripsiPerolehan', KOD_SODO: 'kodSodo',
    PTJ: 'ptjPerolehan', TAHUN_BELI: 'tahunPerolehan', CHARGELINE: 'chargeline', NO_RUJUKAN: 'noRujukanPerolehan', NO_PT: 'noPt',
    NO_IDENTITI: 'noPekerjaPenjaga', NAMA: 'pegawaiBertanggungjawab', EMAIL: 'emailPenjaga', NILAI_PEMBELIAN: 'nilaiPerolehan',
    ID_LOKASI: 'kodLokasi', NEW_COST_CENTER: 'costCenter', TARIKH_ASET: 'tarikhAset', REFERENCE_REQUISITION: 'noRequisition',
    'STATUS ALAT': 'statusPengesahan', 'NAMA PENJAGA TERKINI': 'penjagaTerkini', 'DIKEMASKINI OLEH': 'disemakOleh',
    /* Senarai penyelenggaraan PC makmal (satu sheet bagi setiap makmal) */
    BARKOD: 'noAset', 'NO.SIRI': 'noSiri', 'NO. SIRI': 'noSiri', 'LOKASI MAKMAL': 'lokasiFizikal', 'PIC MAKMAL': 'picMakmal', 'NAMA ALAT': 'namaAlat',
    'TAHUN DIBELI': 'tahunPerolehan', 'JENIS ASET': 'kategoriAset', 'HARGA (RM)': 'nilaiPerolehan', 'STATUS PENGGUNAAN': 'kegunaan', KEWPA: 'borangKewpa', SOP: 'sopAda',
    'PENYELENGARAAN BERKALA SETIAP CUTI SEMESTER': 'selenggaraCutiSem', 'PENYELENGARAAN BULANAN (3 BULAN SEKALI)': 'selenggaraSukuTahun',
    'PENYELENGARAAN MENGIKUT KEADAAN HARDWARE/SOFTWARE & ADUAN SEMASA': 'selenggaraIkutKeadaan'
  };
  const IGNORE = ['PTJ_STAF', 'BIL ALAT'];
  const importFields = () => (KD.moduleOf('aset').fields || []).filter((f) => f.type !== 'files' && !f.readonly);
  const norm = (s) => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');

  /* Import generik modul lain (laluan <modul>.import) */
  const GEN = [{ key: 'makmal', label: 'Makmal' }, { key: 'staf', label: 'Staf makmal' }, { key: 'perisian', label: 'Perisian & lesen' }, { key: 'pegawai', label: 'Pegawai IT' }];
  function bindGeneric(el) {
    const out = qs('[data-gout]', el);
    let rows = [];
    let kind = 'makmal';
    const fieldsOf = (k) => ((KD.moduleOf(k) || {}).fields || []).filter((f) => f.type !== 'files' && !f.readonly);
    on(el, 'change', '[data-gkind]', (e, s2) => { kind = s2.value; rows = []; out.innerHTML = ''; });
    on(el, 'click', '[data-act="gtpl"]', () => {
      const fs = fieldsOf(kind);
      downloadText(toCsv([fs.map((f) => f.key), fs.map((f) => '# ' + f.label)]), 'text/csv', 'templat-import-' + kind + '.csv');
      toast('Templat dimuat turun. Padam baris "#" sebelum import.');
    });
    on(el, 'change', '[data-gfile]', async (e) => {
      const file = e.target.files[0];
      e.target.value = '';
      if (!file) return;
      const fs = fieldsOf(kind);
      const grid = parseCsv(await file.text()).filter((r) => !String(r[0] || '').trim().startsWith('#'));
      if (grid.length < 2) { out.innerHTML = empty('Tiada data', 'Fail perlu ada pengepala dan sekurang-kurangnya satu baris.').s; return; }
      const byName = { status: 'status' };
      fs.forEach((f) => { byName[norm(f.key)] = f.key; byName[norm(f.label)] = f.key; });
      const header = grid[0].map((h) => byName[norm(h)] || null);
      const unknown = grid[0].filter((h, i) => !header[i] && String(h).trim());
      rows = grid.slice(1).map((r) => { const o = {}; header.forEach((k, i) => { if (k && r[i] !== undefined && String(r[i]).trim() !== '') o[k] = String(r[i]).trim(); }); return o; })
        .filter((o) => Object.keys(o).length);
      const cols = header.filter(Boolean);
      const lbl = (c) => (fs.find((f) => f.key === c) || { label: 'Status' }).label;
      out.innerHTML = html`<div class="small"><b>${file.name}</b> · ${(GEN.find((g) => g.key === kind) || {}).label} · ${fmtNum(rows.length)} baris · ${fmtNum(cols.length)} lajur dikenali</div>
        ${unknown.length ? html`<p class="small" style="color:var(--warn)">${icon('alert', 'i-sm')} Lajur tidak dikenali (diabaikan): ${unknown.join(', ')}</p>` : ''}
        <div class="im-scroll mt-2"><table class="xo-table"><thead><tr>${cols.slice(0, 6).map((c) => html`<th>${lbl(c)}</th>`)}</tr></thead>
        <tbody>${rows.slice(0, 5).map((r) => html`<tr>${cols.slice(0, 6).map((c) => html`<td>${r[c] || ''}</td>`)}</tr>`)}</tbody></table></div>
        <div class="row row-wrap mt-4"><button class="btn btn-outline" data-act="gcheck">${icon('check')}Semak data</button><button class="btn btn-primary" data-act="gimport" disabled>${icon('download')}Import ${fmtNum(rows.length)} rekod</button></div>
        <div data-gres class="mt-4"></div>`.s;
    });
    const go = async (dryRun, btn) => {
      const res = qs('[data-gres]', out);
      const t = { created: 0, updated: 0, errors: [], errorCount: 0, skipped: [], skippedCount: 0 };
      try {
        await busy(btn, async () => {
          for (let i = 0; i < rows.length; i += 500) {
            const r = await KD.api.call(kind + '.import', { rows: rows.slice(i, i + 500), dryRun, offset: i });
            t.created += r.created; t.updated += r.updated; t.errorCount += r.errorCount; t.errors = t.errors.concat(r.errors);
            t.skippedCount += r.skippedCount; t.skipped = t.skipped.concat(r.skipped);
            if (!dryRun && r.errorCount) break;
          }
        });
      } catch (err) { toastError(err); return; }
      const ib = qs('[data-act="gimport"]', out);
      const skip = t.skippedCount ? html`<details class="mt-2 small"><summary style="cursor:pointer;color:var(--warn)">${fmtNum(t.skippedCount)} baris dilangkau</summary><ul>${t.skipped.map((x) => html`<li>Baris ${x.line}: ${x.reason}</li>`)}</ul></details>` : '';
      if (t.errorCount) {
        ib.disabled = true;
        res.innerHTML = html`<div class="small" style="color:var(--danger)"><b>${fmtNum(t.errorCount)} ralat.</b> Tiada data ditulis.</div>
          <div class="im-scroll mt-2"><table class="xo-table"><thead><tr><th>Baris</th><th>Rekod</th><th>Ralat</th></tr></thead><tbody>${t.errors.map((x) => html`<tr><td class="num">${x.line}</td><td>${x.noAset}</td><td>${x.message}</td></tr>`)}</tbody></table></div>`.s;
        return;
      }
      ib.disabled = !dryRun;
      res.innerHTML = html`<div class="small" style="color:var(--success)">${icon('check', 'i-sm')} <b>${dryRun ? 'Semakan lulus.' : 'Import selesai.'}</b> ${fmtNum(t.created)} ${dryRun ? 'akan ditambah' : 'ditambah'}, ${fmtNum(t.updated)} ${dryRun ? 'akan dikemas kini' : 'dikemas kini'}.${dryRun ? '' : html` <a href="#/admin/${kind}">Lihat senarai</a>`}</div>${skip}`.s;
      if (!dryRun) toast('Import selesai.');
    };
    on(el, 'click', '[data-act="gcheck"]', (e, b) => go(true, b));
    on(el, 'click', '[data-act="gimport"]', (e, b) => go(false, b));
  }

  /* Butiran makmal: perisian & staf */
  KD.detailSide.makmal = (d) => (d.perisian && d.perisian.length) || (d.staf && d.staf.length) ? html`<div class="status-note">
    ${d.staf && d.staf.length ? html`<strong>Staf makmal (${d.staf.length})</strong><ul class="small" style="margin:6px 0 10px;padding-left:18px">${d.staf.map((x) => html`<li>${x.nama}${x.jawatan ? html` <span class="muted">· ${x.jawatan}</span>` : ''}</li>`)}</ul>` : ''}
    ${d.perisian && d.perisian.length ? html`<strong>Perisian (${d.perisian.length})</strong><ul class="small" style="margin:6px 0 0;padding-left:18px">${d.perisian.map((x) => html`<li>${x.nama} <span class="muted">· ${x.jenisLesen === 'SUMBER_TERBUKA' ? 'sumber terbuka' : (x.sumberLesen || 'berlesen') + (x.bilLesen ? ', ' + fmtNum(x.bilLesen) + ' lesen' : '')}</span></li>`)}</ul>` : ''}
    <div class="mt-2"><a class="small" href="#/admin/perisian?f_makmal=${d.id}">Urus perisian →</a></div></div>` : '';

  KD.views.importAset = {
    async render(el) {
      const fields = importFields();
      el.innerHTML = html`<div class="page-head"><div><h1>Import aset IT</h1><p>Muat naik daftar aset (CSV). Rekod dengan No. aset sedia ada akan dikemas kini; yang baharu akan ditambah.</p></div>
          <div class="xo-toolbar"><button class="btn btn-outline" data-act="tpl">${icon('download')}Templat CSV</button></div></div>
        <div class="im-steps"><div class="im-step"><b>1 · Sediakan fail</b>Guna templat, eksport UTMFin / DATA PC, atau senarai penyelenggaraan makmal (lajur BAR_CODE / BARKOD, ID_LOKASI / LOKASI MAKMAL… dikenali terus). Rekod sedia ada dikemas kini ikut barcode — tiada pendua. Dalam Excel: <i>Fail → Simpan sebagai → CSV UTF-8</i>.</div>
          <div class="im-step"><b>2 · Semak</b>Sistem menyemak setiap baris dahulu (tiada data ditulis). Makmal boleh ditulis sebagai kod (cth. ME-01).</div>
          <div class="im-step"><b>3 · Import</b>Hanya apabila tiada ralat. Status boleh ditulis sebagai label, cth. <i>Berfungsi</i>.</div></div>
        <label class="im-drop mt-4" data-drop style="display:block;cursor:pointer"><div style="display:flex;justify-content:center">${icon('download')}</div><div class="mt-2"><b>Pilih fail CSV</b> atau seret ke sini</div><div class="xs muted mt-1">Maksimum 5,000 baris</div>
          <input type="file" accept=".csv,text/csv" data-file class="sr-only"></label>
        <div data-out class="mt-4"></div>
        <section class="panel mt-4" data-labs><div class="panel-head"><h3>Jana makmal daripada lokasi aset</h3></div>
          <p class="small muted">Untuk aset dengan <b>lokasi fizikal</b> (senarai penyelenggaraan makmal) atau berstatus <b>Penjaga - Penggunaan Makmal</b>: setiap bilik (lokasi fizikal diutamakan, jika tiada guna kod lokasi UTMFin) dengan sekurang-kurangnya
          <select class="select" data-labmin style="width:auto;display:inline-block;padding:2px 28px 2px 8px;height:auto" aria-label="Minimum PC">${[1, 2, 3, 5, 10].map((n) => html`<option value="${n}" ${n === 3 ? raw('selected') : ''}>${n}</option>`)}</select>
          PC dijadikan rekod Makmal, kemudian aset dipautkan ke makmal itu. Makmal sedia ada (ikut kod lokasi) tidak diduplikasi. Nama makmal boleh dikemas kini kemudian.</p>
          <div class="row row-wrap mt-2"><button class="btn btn-outline" data-act="labs-preview">${icon('eye')}Pratonton</button><button class="btn btn-primary" data-act="labs-run">${icon('plus')}Jana & pautkan</button></div>
          <div data-labout class="mt-4"></div></section>
        <section class="panel mt-4" data-gen><div class="panel-head"><h3>Import data makmal, staf, perisian & pegawai</h3></div>
          <p class="small muted">Rekod sedia ada dikemas kini (tiada pendua): makmal ikut <b>kod</b>, staf ikut <b>no. pekerja</b>, perisian ikut <b>makmal + nama perisian</b>, pegawai IT ikut <b>email</b>. Makmal dalam fail staf/perisian ditulis sebagai kod atau nama makmal. Import makmal dahulu.</p>
          <div class="row row-wrap mt-2" style="align-items:center"><select class="select" data-gkind style="width:auto" aria-label="Jenis data">${GEN.map((g) => html`<option value="${g.key}">${g.label}</option>`)}</select>
            <button class="btn btn-outline" data-act="gtpl">${icon('download')}Templat CSV</button>
            <label class="btn btn-primary" style="cursor:pointer">${icon('download')}Pilih fail CSV<input type="file" accept=".csv,text/csv" data-gfile class="sr-only"></label></div>
          <div data-gout class="mt-4"></div></section>`.s;
      bindGeneric(el);
      const out = qs('[data-out]', el);
      let rows = [];

      on(el, 'click', '[data-act="tpl"]', () => {
        const head = fields.map((f) => f.key).concat(['status']);
        const label = fields.map((f) => f.label).concat(['Status']);
        const ex = { noAset: 'UTM/FKM/H/2021/0001', jenis: 'Komputer meja', jenama: 'Dell', model: 'OptiPlex 7090', makmal: 'ME-01', lokasi: 'C23-112', tahunPerolehan: '2021', tamatWaranti: '31/12/2026', cpu: 'Core i7-11700', ramGb: '16', storan: 'SSD 512GB', sistemOperasi: 'Windows 11 Pro', lesenOs: 'Sah / berlesen', keadaanFizikal: 'Baik', cadangan: 'Kekal', disahkanFizikal: 'Ya', status: 'Berfungsi' };
        downloadText(toCsv([head, label.map((x) => '# ' + x), head.map((k) => ex[k] || '')]), 'text/csv', 'templat-import-aset.csv');
        toast('Templat dimuat turun. Padam baris contoh dan baris "#" sebelum import.');
      });

      const accept = async (file) => {
        if (!file) return;
        if (file.size > 3 * 1024 * 1024) { toastError('Fail terlalu besar (maksimum 3 MB).'); return; }
        const text = await file.text();
        const grid = parseCsv(text).filter((r) => !String(r[0] || '').trim().startsWith('#'));
        if (grid.length < 2) { out.innerHTML = empty('Tiada data', 'Fail perlu ada baris pengepala dan sekurang-kurangnya satu baris data.').s; return; }
        const byName = {};
        fields.forEach((f) => { byName[norm(f.key)] = f.key; byName[norm(f.label)] = f.key; });
        byName.status = 'status';
        Object.keys(UTMFIN).forEach((k) => { byName[norm(k)] = UTMFIN[k]; });
        IGNORE.forEach((k) => { byName[norm(k)] = '__skip'; });
        const header = grid[0].map((h) => { const k = byName[norm(h)] || null; return k === '__skip' ? null : k; });
        const unknown = grid[0].filter((h, i) => !header[i] && String(h).trim() && byName[norm(h)] !== '__skip');
        if (!header.includes('noAset')) { out.innerHTML = empty('Lajur No. aset tiada', 'Pengepala mesti mengandungi noAset atau "No. aset". Muat turun templat untuk rujukan.').s; return; }
        rows = grid.slice(1).map((r) => { const o = {}; header.forEach((k, i) => { if (k && r[i] !== undefined && String(r[i]).trim() !== '') o[k] = String(r[i]).trim(); }); return o; });
        if (rows.length > 5000) { toastError('Maksimum 5,000 baris setiap fail.'); rows = []; return; }
        const cols = header.filter(Boolean);
        out.innerHTML = html`<section class="panel"><div class="panel-head"><h3>${file.name}</h3><span class="small">${fmtNum(rows.length)} baris · ${fmtNum(cols.length)} lajur dikenali</span></div>
          ${unknown.length ? html`<p class="small" style="color:var(--warn)">${icon('alert', 'i-sm')} Lajur tidak dikenali (diabaikan): ${unknown.join(', ')}</p>` : ''}
          <div class="im-scroll"><table class="xo-table"><thead><tr>${cols.slice(0, 7).map((c) => html`<th>${(fields.find((f) => f.key === c) || { label: 'Status' }).label}</th>`)}</tr></thead>
          <tbody>${rows.slice(0, 5).map((r) => html`<tr>${cols.slice(0, 7).map((c) => html`<td>${r[c] || ''}</td>`)}</tr>`)}</tbody></table></div>
          ${rows.length > 5 ? html`<p class="xs muted mt-2">Pratonton 5 baris pertama.</p>` : ''}
          <div class="row row-wrap mt-4"><button class="btn btn-outline" data-act="check">${icon('check')}Semak data</button><button class="btn btn-primary" data-act="import" disabled>${icon('download')}Import ${fmtNum(rows.length)} rekod</button></div>
          <div data-result class="mt-4"></div></section>`.s;
      };

      const skippedNote = (total) => total.skippedCount ? html`<details class="mt-2 small"><summary style="cursor:pointer;color:var(--warn)">${icon('alert', 'i-sm')} ${fmtNum(total.skippedCount)} baris dilangkau (tiada barcode / pendua dalam fail) — klik untuk lihat</summary>
        <div class="im-scroll mt-2"><table class="xo-table"><thead><tr><th>Baris</th><th>No. aset</th><th>Sebab</th></tr></thead><tbody>${total.skipped.slice(0, 200).map((x) => html`<tr><td class="num">${x.line}</td><td>${x.noAset || ''}</td><td>${x.reason}</td></tr>`)}</tbody></table></div></details>` : '';
      const run = async (dryRun, btn) => {
        const res = qs('[data-result]', out);
        const CH = 500;
        const total = { created: 0, updated: 0, linked: 0, errors: [], errorCount: 0, skipped: [], skippedCount: 0 };
        try {
          await busy(btn, async () => {
            for (let i = 0; i < rows.length; i += CH) {
              const r = await KD.api.call('aset.import', { rows: rows.slice(i, i + CH), dryRun, offset: i });
              total.created += r.created; total.updated += r.updated; total.errorCount += r.errorCount; total.errors = total.errors.concat(r.errors);
              total.linked += r.linked || 0; total.tindakan = (total.tindakan || 0) + (r.tindakan ? r.tindakan.dicipta : 0); total.skippedCount += r.skippedCount || 0; total.skipped = total.skipped.concat(r.skipped || []);
              if (!dryRun && r.errorCount) break;
            }
          });
        } catch (err) { toastError(err); return; }
        const importBtn = qs('[data-act="import"]', out);
        if (total.errorCount) {
          importBtn.disabled = true;
          res.innerHTML = html`<div class="small" style="color:var(--danger)"><b>${fmtNum(total.errorCount)} ralat ditemui.</b> Betulkan dalam fail dan muat naik semula. Tiada data ditulis.</div>
            <div class="im-scroll mt-2"><table class="xo-table"><thead><tr><th>Baris</th><th>No. aset</th><th>Ralat</th></tr></thead><tbody>${total.errors.slice(0, 100).map((e) => html`<tr><td class="num">${e.line}</td><td>${e.noAset}</td><td>${e.message}</td></tr>`)}</tbody></table></div>`.s;
          return;
        }
        if (dryRun) {
          importBtn.disabled = false;
          res.innerHTML = html`<div class="small" style="color:var(--success)">${icon('check', 'i-sm')} <b>Semakan lulus.</b> ${fmtNum(total.created)} rekod baharu, ${fmtNum(total.updated)} sedia ada akan dikemas kini (tiada pendua dicipta).</div>${skippedNote(total)}`.s;
        } else {
          importBtn.disabled = true;
          toast('Import selesai.');
          res.innerHTML = html`<div class="small" style="color:var(--success)">${icon('check', 'i-sm')} <b>Import selesai.</b> ${fmtNum(total.created)} ditambah, ${fmtNum(total.updated)} dikemas kini${total.linked ? html`, ${fmtNum(total.linked)} dipaut ke makmal` : ''}. <a href="#/admin/aset">Lihat daftar aset</a></div>${total.tindakan ? html`<div class="small mt-1">${icon('shield', 'i-sm')} ${fmtNum(total.tindakan)} tindakan KEWPA baharu dijana. <a href="#/admin/tindakan">Lihat penjejak tindakan</a></div>` : ''}${skippedNote(total)}`.s;
          qs('[data-labs]', el).scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      };
      const labs = async (dryRun, btn) => {
        const out2 = qs('[data-labout]', el);
        try {
          await busy(btn, async () => {
            const r = await KD.api.call('aset.janaMakmal', { min: Number(qs('[data-labmin]', el).value), dryRun });
            out2.innerHTML = html`<div class="small"><b>${dryRun ? 'Akan dicipta' : 'Dicipta'}: ${fmtNum(r.created)} makmal</b>${dryRun ? '' : html` · ${fmtNum(r.linked)} aset dipautkan`}.</div>
              ${r.labs.length ? html`<div class="im-scroll mt-2"><table class="xo-table"><thead><tr><th>Kod</th><th>Nama (sementara)</th><th class="num">PC</th><th>Penjaga utama</th></tr></thead><tbody>${r.labs.map((l) => html`<tr><td>${l.kod}</td><td>${l.nama}</td><td class="num">${fmtNum(l.pc)}</td><td>${l.penyelaras}</td></tr>`)}</tbody></table></div>`
                : html`<p class="xs muted mt-1">Tiada bilik baharu yang memenuhi syarat${dryRun ? '' : '; aset tanpa makmal telah dipautkan jika kod lokasi sepadan'}.</p>`}
              ${!dryRun && r.deactivated && r.deactivated.length ? html`<p class="small mt-2" style="color:var(--warn)">${fmtNum(r.deactivated.length)} makmal jana automatik kini tiada aset (lokasi UTMFin lama) dan ditanda <b>Tidak aktif</b>: ${r.deactivated.join(', ')}.</p>` : ''}
              ${!dryRun && r.created ? html`<p class="small mt-2"><a href="#/admin/makmal">Kemas kini nama makmal →</a></p>` : ''}`.s;
          });
          if (!dryRun) toast('Makmal dijana.');
        } catch (err) { toastError(err); }
      };
      on(el, 'click', '[data-act="labs-preview"]', (e, b) => labs(true, b));
      on(el, 'click', '[data-act="labs-run"]', (e, b) => labs(false, b));
      on(el, 'change', '[data-file]', (e) => accept(e.target.files[0]));
      on(el, 'click', '[data-act="check"]', (e, b) => run(true, b));
      on(el, 'click', '[data-act="import"]', (e, b) => run(false, b));
      const drop = qs('[data-drop]', el);
      drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('is-over'); });
      drop.addEventListener('dragleave', () => drop.classList.remove('is-over'));
      drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('is-over'); accept(e.dataTransfer.files[0]); });
    }
  };

  // ================================================================ Laporan aset (/admin/laporan-aset)
  const TAHAP = {
    GANTI_SEGERA: { label: 'Ganti segera', tone: 'danger' }, GANTI_TAHUN_DEPAN: { label: 'Ganti tahun depan', tone: 'warn' },
    PANTAU: { label: 'Pantau', tone: 'brand' }, OK: { label: 'OK', tone: 'success' }
  };
  const JENIS_LABEL = () => Object.fromEntries(((KD.moduleOf('aset').fields || []).find((f) => f.key === 'jenis') || { options: [] }).options.map((o) => [o.value, o.label]));
  const rmx = (n) => Number(n || 0).toLocaleString('ms-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const umurTxt = (u) => (u === null || u === undefined ? '—' : Number(u).toLocaleString('ms-MY', { maximumFractionDigits: 1 }) + ' thn');
  const card = (label, value, sub, cls) => html`<div class="lp-card ${cls || ''}"><span class="xs muted">${label}</span><b>${value}</b>${sub ? html`<span class="xs muted">${sub}</span>` : ''}</div>`;
  const groupTable = (rows, head) => html`<div class="im-scroll"><table class="xo-table"><thead><tr><th>${head}</th><th class="num">Bil.</th><th class="num">Perolehan (RM)</th><th class="num">Nilai buku (RM)</th></tr></thead>
    <tbody>${rows.map((r) => html`<tr><td>${r.label}</td><td class="num">${fmtNum(r.bil)}</td><td class="num">${rmx(r.kos)}</td><td class="num">${rmx(r.buku)}</td></tr>`)}</tbody></table></div>`;

  const isAdm = () => KD.auth && KD.auth.isAdmin();
  const asetLink = (id, text) => (isAdm() ? html`<a href="#/admin/aset/${id}">${text}</a>` : html`${text}`);
  KD.views.laporanAset = {
    async render(el, params, query) {
      const tab = (query && query.t) || 'nilai';
      const state = { makmal: (query && query.makmal) || '', kategori: '', jenis: tab === 'ganti' ? 'KOMPUTER' : '' };
      let labs = [];
      try { labs = (await KD.api.list('makmal', { pageSize: 100 })).items || []; } catch (e) { labs = []; }
      const JL = JENIS_LABEL();
      const TITLE = { nilai: 'Nilai aset & susut nilai', ganti: 'Cadangan penggantian', lokasi: 'Percanggahan lokasi (UTMFin)' };
      el.innerHTML = html`<div class="page-head"><div><h1>Laporan aset</h1><p>Dikira terus daripada daftar aset.${isAdm() ? html` Kriteria & kadar boleh diubah di <a href="#/admin/tetapan">Tetapan</a>.` : ''}</p></div>
          <div class="xo-toolbar no-print"><button class="btn btn-outline" data-act="csv">${icon('download')}CSV</button><button class="btn btn-outline" data-act="print">${icon('pdf')}Cetak / PDF</button></div></div>
        <nav class="lp-tabs" aria-label="Jenis laporan">${['nilai', 'ganti', 'lokasi'].map((k) => html`<a class="lp-tab ${k === tab ? 'is-active' : ''}" href="#${isAdm() ? '/admin/laporan-aset' : '/pengurusan/laporan-aset'}?t=${k}">${TITLE[k]}</a>`)}</nav>
        <div class="lp-filters">
          <select class="select" data-f="makmal" aria-label="Makmal"><option value="">Semua makmal / lokasi</option>${labs.map((l) => html`<option value="${l.id}" ${l.id === state.makmal ? raw('selected') : ''}>${l.title}${l.values && l.values.kod ? ' (' + l.values.kod + ')' : ''}</option>`)}</select>
          ${tab !== 'lokasi' ? html`<select class="select" data-f="kategori" aria-label="Kategori aset"><option value="">Semua kategori</option><option value="ASET_TETAP">Aset Tetap</option><option value="INVENTORI">Inventori</option></select>` : ''}
          ${tab !== 'lokasi' ? html`<select class="select" data-f="jenis" aria-label="Jenis aset"><option value="">Semua jenis</option><option value="KOMPUTER" ${state.jenis === 'KOMPUTER' ? raw('selected') : ''}>Komputer sahaja</option>${Object.keys(JL).map((k) => html`<option value="${k}">${JL[k]}</option>`)}</select>` : ''}
        </div>
        <div class="print-only"><h2>${TITLE[tab]}</h2></div>
        <div data-box>${skeletonStats(4)}</div>`.s;
      const box = qs('[data-box]', el);
      let data = null;
      const load = async () => {
        box.innerHTML = skeletonStats(4).s;
        const p = { makmal: state.makmal, kategori: state.kategori, jenis: state.jenis };
        try {
          data = await KD.api.call(tab === 'nilai' ? 'aset.laporanNilai' : tab === 'ganti' ? 'aset.laporanGanti' : 'aset.laporanLokasi', p);
          box.innerHTML = (tab === 'nilai' ? viewNilai(data, JL) : tab === 'ganti' ? viewGanti(data, JL) : viewLokasi(data)).s;
        } catch (err) { box.innerHTML = errorState(err, 'reload').s; }
      };
      on(el, 'change', '[data-f]', (e, sel) => { state[sel.getAttribute('data-f')] = sel.value; load(); });
      on(el, 'click', '[data-act="reload"]', load);
      on(el, 'click', '[data-act="print"]', () => window.print());
      on(el, 'click', '[data-act="csv"]', () => {
        if (!data) return;
        let rows;
        if (tab === 'nilai') rows = [['No. aset', 'Item', 'Jenis', 'Makmal', 'Tahun', 'Nilai perolehan (RM)', 'Umur (tahun)', 'Susut setahun (RM)', 'Susut terkumpul (RM)', 'Nilai buku (RM)', 'Susut habis']]
          .concat(data.items.map((i) => [i.noAset, i.model, JL[i.jenis] || i.jenis, i.makmal, i.tahun, i.kos, i.umur === null ? '' : i.umur, i.susutTahunan, i.susutTerkumpul, i.nilaiBuku, i.habis ? 'Ya' : '']));
        else if (tab === 'ganti') rows = [['Tahap', 'Skor', 'No. aset', 'Item', 'Jenis', 'Makmal', 'Lokasi', 'Tahun', 'Umur (tahun)', 'Nilai buku (RM)', 'RAM (GB)', 'Aduan 12 bln', 'Sebab', 'Anggaran kos ganti (RM)']]
          .concat(data.items.map((i) => [TAHAP[i.tahap].label, i.skor, i.noAset, i.model, JL[i.jenis] || i.jenis, i.makmal, i.lokasi, i.tahun, i.umur === null ? '' : i.umur, i.nilaiBuku, i.ram, i.aduan, i.sebab.join('; '), i.anggaranKos]));
        else rows = [['No. aset', 'Item', 'ID_LOKASI UTMFin', 'Lokasi fizikal', 'Makmal', 'Penjaga (KEWPA)', 'PIC makmal']]
          .concat(data.items.map((i) => [i.noAset, i.model, i.kodLokasi, i.lokasiFizikal, i.makmal, i.penjaga, i.picMakmal]));
        downloadText(toCsv(rows), 'text/csv', 'laporan-' + tab + '-' + new Date().toISOString().slice(0, 10) + '.csv');
      });
      load();
    }
  };

  function viewNilai(d, JL) {
    const t = d.total;
    const top = d.items.slice(0, 100);
    return html`<div class="lp-cards">
        ${card('Nilai perolehan', 'RM ' + rmx(t.kos), fmtNum(t.denganKos) + ' aset dengan nilai')}
        ${card('Nilai buku semasa', 'RM ' + rmx(t.buku), t.kos ? Math.round((t.buku / t.kos) * 100) + '% daripada nilai perolehan' : '')}
        ${card('Susut nilai terkumpul', 'RM ' + rmx(t.susut), 'Garis lurus ' + d.config.hayat + ' tahun · nilai sisa RM ' + fmtNum(d.config.sisa))}
        ${card('Telah susut sepenuhnya', fmtNum(t.habis) + ' aset', t.tanpaKos ? fmtNum(t.tanpaKos) + ' aset tiada nilai perolehan' : '', t.habis ? 'is-warn' : '')}
      </div>
      <div class="xo-grid3">
        <section class="panel"><div class="panel-head"><h3>Ikut makmal / lokasi</h3></div>${groupTable(d.byMakmal, 'Makmal')}</section>
        <section class="panel"><div class="panel-head"><h3>Ikut tahun perolehan</h3></div>${groupTable(d.byTahun, 'Tahun')}</section>
      </div>
      <div class="xo-grid3">
        <section class="panel"><div class="panel-head"><h3>Ikut kategori</h3></div>${groupTable(d.byKategori, 'Kategori')}</section>
        <section class="panel"><div class="panel-head"><h3>Ikut jenis</h3></div>${groupTable(d.byJenis.map((r) => Object.assign({}, r, { label: JL[r.label] || r.label })), 'Jenis')}</section>
      </div>
      <section class="panel mt-4"><div class="panel-head"><h3>Senarai aset (${fmtNum(d.items.length)})</h3><span class="xs muted">${d.items.length > 100 ? '100 nilai tertinggi dipaparkan · CSV untuk semua' : ''}</span></div>
        <div class="im-scroll"><table class="xo-table" style="min-width:760px"><thead><tr><th>No. aset</th><th>Item</th><th>Makmal</th><th class="num">Tahun</th><th class="num">Nilai (RM)</th><th class="num">Umur</th><th class="num">Susut terkumpul</th><th class="num">Nilai buku</th></tr></thead>
        <tbody>${top.map((i) => html`<tr><td>${asetLink(i.id, i.noAset)}</td><td>${i.model}</td><td>${i.makmal}</td><td class="num">${i.tahun}</td><td class="num">${rmx(i.kos)}</td><td class="num">${umurTxt(i.umur)}</td><td class="num">${rmx(i.susutTerkumpul)}</td><td class="num">${i.habis ? html`<span style="color:var(--warn);font-weight:600">0.00</span>` : rmx(i.nilaiBuku)}</td></tr>`)}</tbody></table></div>
        <p class="lp-note">Nilai buku = nilai perolehan − susut terkumpul (garis lurus dari tarikh aset, atau 1 Jan tahun perolehan). Untuk perancangan dalaman; angka rasmi ikut rekod Pejabat Bendahari. Dijana ${fmtDate(d.generatedAt, true)}.</p></section>`;
  }

  function viewGanti(d, JL) {
    const r = d.ringkasan, c = d.config;
    return html`<div class="lp-cards">
        ${card('Ganti segera', fmtNum(r.GANTI_SEGERA.bil) + ' aset', 'Anggaran RM ' + rmx(r.GANTI_SEGERA.kos), r.GANTI_SEGERA.bil ? 'is-danger' : '')}
        ${card('Ganti tahun depan', fmtNum(r.GANTI_TAHUN_DEPAN.bil) + ' aset', 'Anggaran RM ' + rmx(r.GANTI_TAHUN_DEPAN.kos), r.GANTI_TAHUN_DEPAN.bil ? 'is-warn' : '')}
        ${card('Pantau', fmtNum(r.PANTAU.bil) + ' aset', 'Belum perlu diganti')}
        ${card('Dinilai', fmtNum(d.jumlahDinilai) + ' aset', fmtNum(r.OK.bil) + ' dalam keadaan OK')}
      </div>
      <p class="lp-note">Kriteria: umur ≥ ${c.umur} thn (+3) · tidak boleh digunakan (+4) · tidak memadai (+3) · perlu dibaiki (+2) · ditanda Ganti (+3) · RAM &lt; ${c.ram}GB (+2) · ≥ ${c.aduan} aduan/12 bln (+2) · nilai buku habis (+1).
        Skor ≥ 6 = ganti segera, 3–5 = tahun depan. Anggaran kos = nilai perolehan asal (atau RM ${fmtNum(c.harga)} jika tiada).</p>
      ${d.byMakmal.length ? html`<section class="panel mt-4"><div class="panel-head"><h3>Ikut makmal</h3></div><div class="im-scroll"><table class="xo-table"><thead><tr><th>Makmal / lokasi</th><th class="num">Segera</th><th class="num">Tahun depan</th><th class="num">Anggaran (RM)</th></tr></thead>
        <tbody>${d.byMakmal.map((m) => html`<tr><td>${m.label}</td><td class="num">${fmtNum(m.segera)}</td><td class="num">${fmtNum(m.tahunDepan)}</td><td class="num">${rmx(m.kos)}</td></tr>`)}</tbody></table></div></section>` : ''}
      <section class="panel mt-4"><div class="panel-head"><h3>Senarai cadangan (${fmtNum(d.items.length)})</h3></div>
        ${d.items.length ? html`<div class="im-scroll"><table class="xo-table" style="min-width:820px"><thead><tr><th>Tahap</th><th>No. aset</th><th>Item</th><th>Makmal / lokasi</th><th class="num">Umur</th><th>Sebab</th><th class="num">Anggaran (RM)</th></tr></thead>
        <tbody>${d.items.slice(0, 300).map((i) => html`<tr><td>${toneBadge(TAHAP[i.tahap].label, TAHAP[i.tahap].tone)}<div class="xs muted mt-1">Skor ${i.skor}</div></td><td>${asetLink(i.id, i.noAset)}</td><td>${i.model}<div class="xs muted">${JL[i.jenis] || i.jenis}</div></td><td>${i.makmal || i.lokasi}</td><td class="num">${umurTxt(i.umur)}</td><td>${i.sebab.map((x) => html`<span class="lp-chip">${x}</span>`)}</td><td class="num">${rmx(i.anggaranKos)}</td></tr>`)}</tbody></table></div>`
          : empty('Tiada cadangan', 'Tiada aset memenuhi kriteria penggantian untuk tapisan ini.')}
        <p class="lp-note">Senarai ini cadangan berasaskan data; keputusan akhir selepas semakan teknikal Unit IT. Dijana ${fmtDate(d.generatedAt, true)}.</p></section>`;
  }

  function viewLokasi(d) {
    return html`<div class="lp-cards">${card('Aset dengan percanggahan', fmtNum(d.total) + ' aset', 'Lokasi fizikal ≠ ID_LOKASI UTMFin', d.total ? 'is-warn' : '')}</div>
      ${d.ringkasan.length ? html`<section class="panel mt-4"><div class="panel-head"><h3>Ringkasan pergerakan (UTMFin → fizikal)</h3></div>${C.hbars(d.ringkasan, { title: 'Pergerakan lokasi', limit: 20 })}</section>` : ''}
      <section class="panel mt-4"><div class="panel-head"><h3>Senarai aset</h3></div>
        ${d.items.length ? html`<div class="im-scroll"><table class="xo-table" style="min-width:720px"><thead><tr><th>No. aset</th><th>Item</th><th>ID_LOKASI UTMFin</th><th>Lokasi fizikal</th><th>Penjaga (KEWPA)</th></tr></thead>
        <tbody>${d.items.map((i) => html`<tr><td>${asetLink(i.id, i.noAset)}</td><td>${i.model}</td><td>${i.kodLokasi}</td><td><b>${i.lokasiFizikal}</b></td><td>${i.penjaga}</td></tr>`)}</tbody></table></div>`
          : empty('Tiada percanggahan', 'Semua aset dengan lokasi fizikal sepadan dengan rekod UTMFin.')}
        <p class="lp-note">Gunakan senarai ini untuk mengemas kini rekod pergerakan aset (KEWPA) di UTMFin. Dijana ${fmtDate(d.generatedAt, true)}.</p></section>`;
  }

  // ================================================================ Perancangan (Dekan / TDP / TD / KJ) & Laporan Eksekutif
  const HEALTH = { BAIK: { label: 'Baik', tone: 'success' }, SEDERHANA: { label: 'Sederhana', tone: 'warn' }, KRITIKAL: { label: 'Kritikal', tone: 'danger' } };
  const pBase = () => (isAdm() ? '/admin/perancangan' : '/pengurusan');
  const pExec = () => (isAdm() ? '/admin/laporan-eksekutif' : '/pengurusan/laporan');
  const pLap = () => (isAdm() ? '/admin/laporan-aset' : '/pengurusan/laporan-aset');
  const scoreBar = (n) => html`<div style="display:flex;align-items:center;gap:8px;min-width:120px"><div class="xo-meter__track" style="flex:1"><div class="xo-meter__fill ${n >= 70 ? 'is-ok' : n >= 40 ? 'is-warn' : ''}" style="width:${n}%;${n < 40 ? 'background:var(--danger)' : ''}"></div></div><b class="small" style="min-width:26px;text-align:right">${n}</b></div>`;
  const yearMatrix = (rows, years) => html`<div class="im-scroll"><table class="xo-table" style="min-width:${260 + years.length * 70}px"><thead><tr><th>Makmal / lokasi</th>${years.map((y) => html`<th class="num">${y}</th>`)}<th class="num">Jumlah</th></tr></thead>
    <tbody>${rows.map((r) => { const tot = years.reduce((s2, y) => s2 + (r.tahun[y] || 0), 0); return html`<tr><td>${r.label}</td>${years.map((y) => html`<td class="num">${r.tahun[y] ? fmtNum(r.tahun[y]) : html`<span class="muted">–</span>`}</td>`)}<td class="num"><b>${fmtNum(tot)}</b></td></tr>`; })}</tbody></table></div>`;

  function healthTable(items, compact) {
    return html`<div class="im-scroll"><table class="xo-table" style="min-width:${compact ? 520 : 760}px"><thead><tr><th>Makmal</th><th>Indeks</th><th>Tahap</th><th class="num">PC</th><th class="num">Umur purata</th><th class="num">Rosak</th><th class="num">Perlu ganti</th>${compact ? '' : html`<th class="num">Aduan 12 bln</th><th class="num">Disahkan</th>`}</tr></thead>
      <tbody>${items.map((i) => html`<tr><td>${i.label}</td><td>${scoreBar(i.skor)}</td><td>${toneBadge(HEALTH[i.tahap].label, HEALTH[i.tahap].tone)}</td><td class="num">${fmtNum(i.pc)}</td><td class="num">${umurTxt(i.umurPurata)}</td><td class="num">${fmtNum(i.rosak)}</td><td class="num">${fmtNum(i.perluGanti)} <span class="xs muted">(${i.pctGanti}%)</span></td>${compact ? '' : html`<td class="num">${fmtNum(i.aduan)}</td><td class="num">${i.pctDisahkan}%</td>`}</tr>`)}</tbody></table></div>`;
  }

  KD.views.perancangan = {
    async render(el, params, query) {
      const tab = (query && query.t) || 'ringkasan';
      const T = { ringkasan: 'Ringkasan', pelan: 'Pelan penggantian 5 tahun', makmal: 'Indeks kesihatan makmal', trend: 'Trend & tindakan KEWPA' };
      el.innerHTML = html`<div class="page-head"><div><h1>Perancangan aset IT</h1><p>Untuk Dekan, Timbalan Dekan, TDP dan Ketua Jabatan — gambaran aset IT FKM dan unjuran keperluan penggantian.</p></div>
          <div class="xo-toolbar no-print"><a class="btn btn-primary" href="#${pExec()}">${icon('pdf')}Laporan Eksekutif</a><a class="btn btn-outline" href="#${pLap()}">${icon('list')}Laporan aset</a></div></div>
        <nav class="lp-tabs">${Object.keys(T).map((k) => html`<a class="lp-tab ${k === tab ? 'is-active' : ''}" href="#${pBase()}?t=${k}">${T[k]}</a>`)}</nav>
        <div data-box>${skeletonStats(4)}</div>`.s;
      const box = qs('[data-box]', el);
      try {
        if (tab === 'ringkasan') {
          const e = await KD.api.call('aset.eksekutif', {});
          box.innerHTML = viewRingkasan(e).s;
        } else if (tab === 'trend') {
          const [tr, ks] = await Promise.all([KD.api.call('aset.trend', { bulan: 12 }), KD.api.call('tindakan.ringkasan', {})]);
          box.innerHTML = viewTrend(tr, ks).s;
          on(el, 'click', '[data-act="emel"]', async (e2, b) => {
            const ujian = b.getAttribute('data-ujian') === '1';
            if (!ujian && !(await confirm({ title: 'Hantar ringkasan sekarang?', message: 'Ringkasan bulan semasa (setakat hari ini) akan diemelkan kepada semua pengguna Pengurusan, Admin dan penerima tambahan dalam Tetapan.', confirmText: 'Hantar' }))) return;
            await busy(b, async () => {
              const r = await KD.api.call('aset.hantarRingkasan', { ujian });
              toast(ujian ? (r.dihantar ? 'Email ujian dihantar kepada anda.' : 'Email tidak dapat dihantar (kuota / akaun tiada email).') : 'Dihantar kepada ' + fmtNum(r.dihantar) + ' daripada ' + fmtNum(r.penerima) + ' penerima.');
            }).catch(toastError);
          });
        } else if (tab === 'makmal') {
          const h = await KD.api.call('aset.indeksMakmal', {});
          box.innerHTML = html`${h.items.length ? html`<div class="lp-cards">
              ${card('Makmal dinilai', fmtNum(h.items.length), '')}
              ${card('Kritikal', fmtNum(h.items.filter((i) => i.tahap === 'KRITIKAL').length), 'Indeks < 40', h.items.some((i) => i.tahap === 'KRITIKAL') ? 'is-danger' : '')}
              ${card('Sederhana', fmtNum(h.items.filter((i) => i.tahap === 'SEDERHANA').length), 'Indeks 40–69', 'is-warn')}
              ${card('Baik', fmtNum(h.items.filter((i) => i.tahap === 'BAIK').length), 'Indeks ≥ 70')}</div>
            <section class="panel mt-4"><div class="panel-head"><h3>Indeks ikut makmal (paling kritikal di atas)</h3></div>${healthTable(h.items)}
              <p class="lp-note">Indeks 0–100 (tinggi = sihat), ditolak mengikut umur purata PC (30), % rosak (25), % perlu ganti (25), aduan setiap PC dalam 12 bulan (10) dan % belum disahkan fizikal (10). Umur dianggap tua: ${h.umurGanti} tahun.</p></section>`
            : empty('Tiada makmal', 'Belum ada makmal dengan komputer dipautkan.')}`.s;
        } else {
          let state = { harga: '', bajet: '', tahun: 5 };
          const run = async () => {
            const out = qs('[data-plan]', el);
            out.innerHTML = skeletonStats(3).s;
            const p = await KD.api.call('aset.pelan', { harga: state.harga, bajet: state.bajet, tahun: state.tahun });
            if (!state.harga) qs('[data-in="harga"]', el).placeholder = String(p.harga);
            out.innerHTML = viewPelan(p).s;
          };
          box.innerHTML = html`<section class="panel no-print"><div class="panel-head"><h3>Andaian</h3></div>
              <div class="lp-filters" style="margin:0;align-items:flex-end">
                <label class="small">Tempoh (tahun)<br><select class="select" data-in="tahun">${[3, 5, 7, 10].map((n) => html`<option value="${n}" ${n === 5 ? raw('selected') : ''}>${n}</option>`)}</select></label>
                <label class="small">Harga seunit PC baharu (RM)<br><input class="input" type="number" min="0" step="100" data-in="harga" style="width:170px"></label>
                <label class="small">Bajet setahun (RM) — untuk simulasi<br><input class="input" type="number" min="0" step="1000" data-in="bajet" placeholder="cth. 200000" style="width:200px"></label>
                <button class="btn btn-primary" data-act="kira">${icon('chart')}Kira</button></div>
              <p class="lp-note">Komputer dianggap perlu diganti apabila mencapai had umur (Tetapan) atau berskor "ganti segera". Kosongkan bajet untuk lihat keperluan penuh; isi bajet untuk simulasi susunan penggantian ikut keutamaan.</p></section>
            <div data-plan class="mt-4"></div>`.s;
          on(el, 'click', '[data-act="kira"]', async (e2, b) => {
            state = { harga: qs('[data-in="harga"]', el).value, bajet: qs('[data-in="bajet"]', el).value, tahun: Number(qs('[data-in="tahun"]', el).value) };
            await busy(b, run).catch(toastError);
          });
          await run();
        }
      } catch (err) { box.innerHTML = errorState(err).s; }
    }
  };

  function viewRingkasan(e) {
    const r = e.ringkasan;
    return html`<div class="lp-cards">
        ${card('Aset IT', fmtNum(r.aset), pctTxt(r.beroperasiPct) + ' beroperasi')}
        ${card('Nilai perolehan', 'RM ' + rmx(r.nilaiPerolehan), 'Nilai buku RM ' + rmx(r.nilaiBuku))}
        ${card('Perlu diganti', fmtNum(r.gantiSegera + r.gantiTahunDepan) + ' komputer', fmtNum(r.gantiSegera) + ' segera · anggaran RM ' + rmx(r.kosGanti), r.gantiSegera ? 'is-danger' : 'is-warn')}
        ${card('Aduan IT terbuka', fmtNum(r.tiketTerbuka), (r.tiketLewat ? fmtNum(r.tiketLewat) + ' lewat SLA · ' : '') + 'SLA terkini ' + pctTxt(r.sla), r.tiketLewat ? 'is-warn' : '')}
      </div>
      <div class="xo-grid2">
        <section class="panel"><div class="panel-head"><h3>Perkara untuk perhatian / keputusan</h3></div>
          ${e.isu.length ? e.isu.map((i) => html`<div class="xo-issue xo-issue--${i.tone}">${icon('alert', 'i-sm')}<span class="small">${i.teks}</span></div>`) : html`<p class="muted small">Tiada isu utama.</p>`}</section>
        <section class="panel"><div class="panel-head"><h3>Unjuran keperluan penggantian</h3><a class="small" href="#${pBase()}?t=pelan">Pelan penuh</a></div>
          ${C.bars(e.pelan.keperluan.map((k) => ({ label: String(k.tahun), value: k.bil })), { title: 'Komputer perlu diganti ikut tahun', height: 170 })}
          <p class="lp-note">${fmtNum(e.pelan.jumlahDalamTempoh)} komputer dalam 5 tahun · ≈ RM ${rmx(e.pelan.kosDalamTempoh)} (RM ${fmtNum(e.pelan.harga)} seunit) · purata RM ${rmx(e.pelan.bajetSetahunDiperlukan)} setahun.</p></section>
      </div>
      <section class="panel mt-4"><div class="panel-head"><h3>Kesihatan makmal</h3><a class="small" href="#${pBase()}?t=makmal">Butiran</a></div>${e.makmal.length ? healthTable(e.makmal.slice(0, 8), true) : html`<p class="muted small">Tiada makmal.</p>`}</section>`;
  }

  const monShort = (k) => { const p = String(k).split('-'); return MON[Number(p[1]) - 1] + ' ' + String(p[0]).slice(2); };
  /** Perubahan berbanding bulan sebelumnya: teks + nada (naik baik / naik buruk). */
  const delta = (items, key, goodUp, unit) => {
    if (items.length < 2) return '';
    const a = items[items.length - 1][key], b = items[items.length - 2][key];
    if (a === null || b === null || a === undefined || b === undefined) return '';
    const d = Math.round((a - b) * 10) / 10;
    if (!d) return 'tiada perubahan';
    const good = goodUp ? d > 0 : d < 0;
    return html`<span style="color:var(${goodUp === null ? '--muted' : good ? '--success' : '--danger'});font-weight:600">${d > 0 ? '▲' : '▼'} ${unit === 'RM' ? 'RM ' + rmx(Math.abs(d)) : fmtNum(Math.abs(d)) + (unit || '')}</span> vs bulan lepas`;
  };
  const series = (items, fn) => items.map((i) => ({ label: i.bulan, value: fn(i) })).filter((d) => d.value !== null && d.value !== undefined && !isNaN(d.value));
  const JENIS_T = { LOKASI: 'Kemas kini lokasi / pergerakan aset', PENJAGA: 'Kemas kini penjaga aset', PENGESAHAN: 'Sahkan status aset dengan penjaga', PELUPUSAN: 'Susulan tindakan pelupusan', REKOD_LUPUS: 'Kemas kini rekod lupus di UTMFin', LAIN: 'Lain-lain' };

  function viewTrend(tr, ks) {
    const it = tr.items;
    const cur = it[it.length - 1];
    const chart = (title, fn, note) => {
      const d = series(it, fn);
      return html`<section class="panel"><div class="panel-head"><h3>${title}</h3></div>${d.length > 1 ? C.line(d, { title, height: 170, labelFormat: 'month' }) : html`<p class="muted small">Perlu sekurang-kurangnya 2 bulan data.</p>`}${note ? html`<p class="lp-note">${note}</p>` : ''}</section>`;
    };
    const k = ks.jumlah;
    return html`<div class="lp-cards">
        ${card('Beroperasi', pctTxt(cur.beroperasiPct), delta(it, 'beroperasiPct', true, ' mata %') || fmtNum(cur.aset) + ' aset aktif')}
        ${card('Nilai buku', 'RM ' + rmx(cur.nilaiBuku), delta(it, 'nilaiBuku', null, 'RM') || 'Perolehan RM ' + rmx(cur.nilaiKos))}
        ${card('Perlu diganti', fmtNum((cur.gantiSegera || 0) + (cur.gantiTahunDepan || 0)) + ' PC', delta(it, 'gantiSegera', false) || fmtNum(cur.gantiSegera) + ' segera', cur.gantiSegera ? 'is-warn' : '')}
        ${card('Tindakan KEWPA terbuka', fmtNum(k.terbuka), k.lewat ? fmtNum(k.lewat) + ' melepasi tarikh sasaran' : fmtNum(k.selesai30) + ' selesai dalam 30 hari', k.lewat ? 'is-danger' : '')}
      </div>
      ${it.length < 2 ? html`<div class="xo-issue xo-issue--warn mt-4">${icon('info', 'i-sm')}<span class="small">Ringkasan disimpan secara automatik setiap hari. Graf trend akan terbina bermula bulan depan; email ringkasan pertama dihantar pada awal bulan depan.</span></div>` : ''}
      <div class="tr-grid mt-4">
        ${chart('Komputer perlu diganti', (i) => (i.gantiSegera === null ? null : i.gantiSegera + (i.gantiTahunDepan || 0)), 'Segera + tahun depan (skor penggantian).')}
        ${chart('Indeks purata kesihatan makmal', (i) => i.indeksPurata, '0–100, tinggi = sihat.')}
        ${chart('Aset disahkan secara fizikal (%)', (i) => i.disahkanPct)}
        ${chart('Tindakan KEWPA masih terbuka', (i) => i.tindakanTerbuka)}
        ${chart('Aduan IT baharu sebulan', (i) => i.tiketBaru)}
        ${chart('Nilai buku (RM)', (i) => i.nilaiBuku)}
      </div>
      <section class="panel mt-4"><div class="panel-head"><h3>Ringkasan ikut bulan</h3></div>
        <div class="im-scroll"><table class="xo-table" style="min-width:760px"><thead><tr><th>Bulan</th><th class="num">Aset</th><th class="num">Beroperasi</th><th class="num">Nilai buku (RM)</th><th class="num">Perlu ganti</th><th class="num">Makmal kritikal</th><th class="num">Aduan baharu / selesai</th><th class="num">SLA</th><th class="num">KEWPA terbuka</th></tr></thead>
        <tbody>${it.slice().reverse().map((i) => html`<tr><td>${monShort(i.bulan)}${i.bulan === tr.bulanSemasa ? html` <span class="xs muted">(setakat hari ini)</span>` : ''}</td><td class="num">${fmtNum(i.aset)}</td><td class="num">${pctTxt(i.beroperasiPct)}</td><td class="num">${rmx(i.nilaiBuku)}</td><td class="num">${fmtNum((i.gantiSegera || 0) + (i.gantiTahunDepan || 0))}</td><td class="num">${fmtNum(i.makmalKritikal)}</td><td class="num">${fmtNum(i.tiketBaru)} / ${fmtNum(i.tiketSelesai)}</td><td class="num">${pctTxt(i.slaPct)}</td><td class="num">${i.tindakanTerbuka === null ? '—' : fmtNum(i.tindakanTerbuka)}</td></tr>`)}</tbody></table></div></section>
      <section class="panel mt-4"><div class="panel-head"><h3>Tindakan KEWPA</h3>${isAdm() ? html`<a class="small" href="#/admin/tindakan">Buka penjejak</a>` : ''}</div>
        ${ks.ikutJenis.length ? html`<div class="im-scroll"><table class="xo-table" style="min-width:0"><thead><tr><th>Jenis tindakan</th><th class="num">Terbuka</th><th class="num">Lewat</th><th class="num">Selesai</th></tr></thead>
          <tbody>${ks.ikutJenis.map((j) => html`<tr><td>${isAdm() ? html`<a href="#/admin/tindakan?f_jenis=${j.jenis}">${JENIS_T[j.jenis] || j.label}</a>` : (JENIS_T[j.jenis] || j.label)}</td><td class="num">${fmtNum(j.terbuka)}</td><td class="num">${j.lewat ? html`<span style="color:var(--danger);font-weight:600">${fmtNum(j.lewat)}</span>` : '0'}</td><td class="num">${fmtNum(j.selesai)}</td></tr>`)}</tbody></table></div>
          <p class="lp-note">${pctTxt(ks.pctSelesai)} tindakan selesai keseluruhan · ${fmtNum(k.selesaiBulanIni)} selesai bulan ini. Tindakan dijana automatik daripada daftar aset (lokasi berbeza, penjaga bertukar, belum disahkan, pelupusan) dan ditutup sendiri apabila rekod aset dibetulkan. Sasaran ${ks.sasaranHari} hari.</p>`
          : html`<p class="muted small">Tiada tindakan KEWPA. Tindakan dijana selepas import daftar aset.</p>`}</section>
      ${isAdm() ? html`<section class="panel mt-4 no-print"><div class="panel-head"><h3>Email ringkasan bulanan</h3></div>
        <p class="small">${tr.emelAktif ? html`<b style="color:var(--success)">Aktif.</b> Ringkasan bulan lepas diemelkan secara automatik pada awal setiap bulan kepada pengguna Pengurusan, Admin dan penerima tambahan.` : html`<b style="color:var(--warn)">Dimatikan</b> dalam Tetapan.`} Ubah di <a href="#/admin/tetapan">Tetapan</a> (Email ringkasan bulanan, Penerima tambahan).</p>
        <div class="xo-toolbar mt-2"><button class="btn btn-outline" data-act="emel" data-ujian="1">${icon('mail')}Hantar ujian kepada saya</button><button class="btn btn-primary" data-act="emel" data-ujian="0">${icon('send')}Hantar kepada semua sekarang</button></div></section>` : ''}`;
  }

  function viewPelan(p) {
    const s2 = p.simulasi;
    return html`<div class="lp-cards">
        ${card('Tertunggak (tahun ini)', fmtNum(p.tertunggak) + ' PC', 'RM ' + rmx(p.tertunggak * p.harga), p.tertunggak ? 'is-danger' : '')}
        ${card('Jumlah ' + p.tahun.length + ' tahun', fmtNum(p.jumlahDalamTempoh) + ' PC', 'RM ' + rmx(p.kosDalamTempoh))}
        ${card('Purata bajet diperlukan', 'RM ' + rmx(p.bajetSetahunDiperlukan), 'setahun untuk ' + p.tahun.length + ' tahun')}
        ${card('Komputer dinilai', fmtNum(p.jumlahKomputer), p.tanpaTahun ? fmtNum(p.tanpaTahun) + ' tiada tahun perolehan' : 'Had umur ' + p.umurGanti + ' tahun')}
      </div>
      <div class="xo-grid2">
        <section class="panel"><div class="panel-head"><h3>Keperluan ikut tahun (tanpa had bajet)</h3></div>
          ${C.bars(p.keperluan.map((k) => ({ label: String(k.tahun), value: k.bil })), { title: 'Keperluan penggantian', height: 180 })}
          <div class="im-scroll mt-2"><table class="xo-table"><thead><tr><th>Tahun</th><th class="num">Komputer</th><th class="num">Kos (RM)</th></tr></thead><tbody>${p.keperluan.map((k, i) => html`<tr><td>${k.tahun}${i === 0 ? html` <span class="xs muted">(termasuk tertunggak)</span>` : ''}</td><td class="num">${fmtNum(k.bil)}</td><td class="num">${rmx(k.kos)}</td></tr>`)}</tbody></table></div></section>
        ${s2 ? html`<section class="panel"><div class="panel-head"><h3>Simulasi: bajet RM ${rmx(s2.bajet)} setahun</h3></div>
          <p class="small">${fmtNum(s2.unitSetahun)} PC boleh diganti setahun. ${s2.tahunSelesai ? html`<b style="color:var(--success)">Tunggakan selesai pada ${s2.tahunSelesai}.</b>` : html`<b style="color:var(--danger)">Tunggakan belum selesai dalam ${p.tahun.length} tahun</b> — bajet perlu ditambah.`}</p>
          <div class="im-scroll"><table class="xo-table" style="min-width:0"><thead><tr><th>Tahun</th><th class="num">Diganti</th><th class="num">Kos (RM)</th><th class="num">Baki tertunggak</th></tr></thead>
          <tbody>${s2.rows.map((r) => html`<tr><td>${r.tahun}</td><td class="num">${fmtNum(r.diganti)}</td><td class="num">${rmx(r.kos)}</td><td class="num">${r.tertunggakAkhirTahun ? html`<span style="color:var(--danger);font-weight:600">${fmtNum(r.tertunggakAkhirTahun)}</span>` : '0'}</td></tr>`)}</tbody></table></div></section>`
          : html`<section class="panel"><div class="panel-head"><h3>Simulasi bajet</h3></div><p class="small muted">Isi "Bajet setahun" dan tekan Kira untuk melihat berapa PC boleh diganti setiap tahun, bila tunggakan selesai, dan makmal mana didahulukan (ikut skor keutamaan).</p></section>`}
      </div>
      <section class="panel mt-4"><div class="panel-head"><h3>${s2 ? 'Jadual penggantian ikut makmal (simulasi)' : 'Keperluan ikut makmal & tahun'}</h3></div>${yearMatrix(s2 ? s2.byMakmal : p.byMakmal, p.tahun)}
        <p class="lp-note">Anggaran guna harga seunit PC baharu (bukan harga asal). Dijana ${fmtDate(p.generatedAt, true)}.</p></section>`;
  }

  KD.views.laporanEksekutif = {
    async render(el) {
      el.innerHTML = skeletonStats(4).s;
      let e;
      try { e = await KD.api.call('aset.eksekutif', {}); } catch (err) { el.innerHTML = errorState(err).s; return; }
      const r = e.ringkasan;
      const today = new Date().toLocaleDateString('ms-MY', { day: 'numeric', month: 'long', year: 'numeric' });
      el.innerHTML = html`<div class="page-head no-print"><div><a class="back-link" href="#${pBase()}">${icon('chev-left', 'i-sm')}Perancangan</a><h1 class="mt-2">Laporan Eksekutif</h1><p>Sedia untuk dicetak atau disimpan sebagai PDF (pilih "Save as PDF").</p></div>
          <div class="xo-toolbar"><button class="btn btn-primary" data-act="print">${icon('pdf')}Cetak / Simpan PDF</button></div></div>
        <article class="panel ex-doc">
          <header style="border-bottom:2px solid var(--brand-900);padding-bottom:12px;margin-bottom:16px">
            <div class="xs muted">${(KD.config && KD.config.ORG_NAME) || 'Fakulti Kejuruteraan Mekanikal, UTM'}</div>
            <h2 style="margin:4px 0">Laporan Eksekutif Aset IT</h2>
            <div class="small muted">Disediakan oleh Unit IT · ${today}</div></header>
          <h3>1. Ringkasan</h3>
          <div class="im-scroll"><table class="xo-table" style="min-width:0"><tbody>
            <tr><td>Jumlah aset IT aktif</td><td class="num"><b>${fmtNum(r.aset)}</b> (${pctTxt(r.beroperasiPct)} beroperasi)</td></tr>
            <tr><td>Nilai perolehan / nilai buku semasa</td><td class="num"><b>RM ${rmx(r.nilaiPerolehan)}</b> / RM ${rmx(r.nilaiBuku)}</td></tr>
            <tr><td>Aset telah susut nilai sepenuhnya</td><td class="num">${fmtNum(r.susutHabis)}</td></tr>
            <tr><td>Komputer perlu diganti (segera / tahun depan)</td><td class="num"><b>${fmtNum(r.gantiSegera)}</b> / ${fmtNum(r.gantiTahunDepan)} — anggaran RM ${rmx(r.kosGanti)}</td></tr>
            <tr><td>Aset disahkan secara fizikal</td><td class="num">${pctTxt(r.disahkanPct)}</td></tr>
            <tr><td>Aduan IT terbuka / lewat SLA</td><td class="num">${fmtNum(r.tiketTerbuka)} / ${fmtNum(r.tiketLewat)}</td></tr>
            ${e.tindakan ? html`<tr><td>Tindakan KEWPA terbuka / lewat sasaran</td><td class="num">${fmtNum(e.tindakan.jumlah.terbuka)} / ${fmtNum(e.tindakan.jumlah.lewat)}</td></tr>` : ''}
          </tbody></table></div>
          <h3 class="mt-6">2. Perkara untuk perhatian dan keputusan</h3>
          ${e.isu.length ? html`<ol class="small" style="padding-left:20px">${e.isu.map((i) => html`<li style="margin:4px 0">${i.teks}</li>`)}</ol>` : html`<p class="small">Tiada isu utama.</p>`}
          <h3 class="mt-6">3. Unjuran keperluan penggantian komputer (5 tahun)</h3>
          <div class="im-scroll"><table class="xo-table" style="min-width:0"><thead><tr><th>Tahun</th><th class="num">Komputer</th><th class="num">Anggaran (RM)</th></tr></thead><tbody>${e.pelan.keperluan.map((k, i) => html`<tr><td>${k.tahun}${i === 0 ? ' (termasuk tertunggak)' : ''}</td><td class="num">${fmtNum(k.bil)}</td><td class="num">${rmx(k.kos)}</td></tr>`)}
            <tr><td><b>Jumlah</b></td><td class="num"><b>${fmtNum(e.pelan.jumlahDalamTempoh)}</b></td><td class="num"><b>${rmx(e.pelan.kosDalamTempoh)}</b></td></tr></tbody></table></div>
          <p class="lp-note">Purata peruntukan diperlukan ≈ RM ${rmx(e.pelan.bajetSetahunDiperlukan)} setahun (RM ${fmtNum(e.pelan.harga)} seunit, had umur ${e.pelan.umurGanti} tahun).</p>
          ${e.keperluan && e.keperluan.jumlah.semua.makmal ? html`<h3 class="mt-6">3a. Permohonan keperluan ICT makmal ${e.keperluan.tahun}</h3>
          ${KD.keperluanSummaryTable ? KD.keperluanSummaryTable(e.keperluan) : ''}
          <p class="lp-note">Daripada borang Penilaian Keperluan ICT Makmal: penggantian (komputer tidak sesuai / rosak tidak ekonomi) dan penambahan (kapasiti baharu) dijumlah berasingan.</p>` : ''}
          <h3 class="mt-6">4. Kesihatan makmal komputer</h3>
          ${e.makmal.length ? healthTable(e.makmal, true) : html`<p class="small">Tiada makmal.</p>`}
          <h3 class="mt-6">5. Nilai aset ikut makmal / lokasi</h3>
          ${groupTable(e.nilaiIkutMakmal, 'Makmal / lokasi')}
          ${e.trend && e.trend.length > 1 ? html`<h3 class="mt-6">6. Trend bulanan</h3>
          <div class="im-scroll"><table class="xo-table" style="min-width:0"><thead><tr><th>Bulan</th><th class="num">Beroperasi</th><th class="num">Nilai buku (RM)</th><th class="num">Perlu ganti</th><th class="num">Makmal kritikal</th><th class="num">Aduan baharu</th><th class="num">KEWPA terbuka</th></tr></thead>
          <tbody>${e.trend.map((i) => html`<tr><td>${monShort(i.bulan)}</td><td class="num">${pctTxt(i.beroperasiPct)}</td><td class="num">${rmx(i.nilaiBuku)}</td><td class="num">${fmtNum((i.gantiSegera || 0) + (i.gantiTahunDepan || 0))}</td><td class="num">${fmtNum(i.makmalKritikal)}</td><td class="num">${fmtNum(i.tiketBaru)}</td><td class="num">${i.tindakanTerbuka === null ? '—' : fmtNum(i.tindakanTerbuka)}</td></tr>`)}</tbody></table></div>` : ''}
          <h3 class="mt-6">${e.trend && e.trend.length > 1 ? '7' : '6'}. Kaedah</h3>
          <p class="small">Susut nilai garis lurus ${e.kaedah.susut.hayat} tahun, nilai sisa RM ${fmtNum(e.kaedah.susut.sisa)} (untuk perancangan dalaman; nilai rasmi ikut Pejabat Bendahari).
            Cadangan penggantian berskor: umur ≥ ${e.kaedah.ganti.umur} tahun, status kerosakan, tanda "Ganti", RAM &lt; ${e.kaedah.ganti.ram}GB, ≥ ${e.kaedah.ganti.aduan} aduan dalam 12 bulan.
            Data: daftar aset UTMFin, senarai penyelenggaraan makmal dan rekod helpdesk dalam sistem Dashboard Unit IT FKM pada ${fmtDate(e.generatedAt, true)}.</p>
        </article>`.s;
      on(el, 'click', '[data-act="print"]', () => window.print());
    }
  };

  /* Panel nilai di halaman butiran aset */
  KD.detailSide.aset = (d) => d.susutNilai ? html`<div class="status-note"><strong>Nilai & susut nilai</strong>
    <dl class="rec-detail__meta" style="grid-template-columns:1fr 1fr;margin-top:var(--sp-2)">
      <div><dt>Nilai perolehan</dt><dd>RM ${rmx(d.susutNilai.kos)}</dd></div><div><dt>Nilai buku</dt><dd>RM ${rmx(d.susutNilai.nilaiBuku)}</dd></div>
      <div><dt>Umur</dt><dd>${umurTxt(d.susutNilai.umurTahun)}</dd></div><div><dt>Susut setahun</dt><dd>RM ${rmx(d.susutNilai.susutTahunan)}</dd></div></dl>
    <div class="mt-2"><a class="small" href="#/admin/laporan-aset?t=ganti">Lihat cadangan penggantian →</a></div></div>` : '';

  /* Penjejak tindakan KEWPA: butang segerak di halaman senarai */
  KD.listActions.tindakan = {
    render: () => html`<button class="btn btn-outline" data-list-act="segerak">${icon('refresh')}Segerak dengan daftar aset</button>`,
    run: (act, b, reload) => busy(b, async () => {
      try {
        const r = await KD.api.call('tindakan.segerak', {});
        toast(fmtNum(r.dicipta) + ' tindakan baharu, ' + fmtNum(r.ditutup) + ' ditutup automatik · ' + fmtNum(r.terbuka) + ' terbuka.');
        reload();
      } catch (err) { toastError(err); }
    })
  };

  // ================================================================ Pendaftaran laluan & menu
  ['aset.overview', 'aset.eksekutif', 'aset.laporanNilai', 'aset.laporanGanti', 'aset.laporanLokasi', 'aset.pelan', 'aset.indeksMakmal', 'aset.trend', 'tindakan.ringkasan']
    .forEach((a) => KD.api.cacheable && KD.api.cacheable.add(a));
  KD.views.adminSistem = KD.views.adminDashboard;
  KD.views.adminDashboard = overview;
  KD.extraRoutes.push({ path: '/admin/import-aset', view: 'importAset', access: 'admin', layout: 'admin', title: 'Import aset' });
  KD.extraRoutes.push({ path: '/admin/sistem', view: 'adminSistem', access: 'admin', layout: 'admin', title: 'Statistik sistem' });
  KD.extraRoutes.push({ path: '/admin/laporan-aset', view: 'laporanAset', access: 'admin', layout: 'admin', title: 'Laporan aset' });
  KD.extraRoutes.push({ path: '/admin/perancangan', view: 'perancangan', access: 'admin', layout: 'admin', title: 'Perancangan' });
  KD.extraRoutes.push({ path: '/admin/laporan-eksekutif', view: 'laporanEksekutif', access: 'admin', layout: 'admin', title: 'Laporan Eksekutif' });
  KD.extraRoutes.push({ path: '/pengurusan', view: 'perancangan', access: 'management', layout: 'app', title: 'Perancangan aset IT' });
  KD.extraRoutes.push({ path: '/pengurusan/laporan', view: 'laporanEksekutif', access: 'management', layout: 'app', title: 'Laporan Eksekutif' });
  KD.extraRoutes.push({ path: '/pengurusan/laporan-aset', view: 'laporanAset', access: 'management', layout: 'app', title: 'Laporan aset' });
  KD.extraNav.user.push(['/pengurusan', 'chart', 'Perancangan', 'management'], ['/pengurusan/laporan-aset', 'list', 'Laporan aset', 'management'], ['/pengurusan/laporan', 'pdf', 'Laporan Eksekutif', 'management']);
  KD.homePath = (role) => (role === 'PENGURUSAN' ? '/pengurusan' : null);
  KD.bottomNavFor = (items, role) => (role === 'PENGURUSAN' ? [['/pengurusan', 'chart', 'Perancangan'], ['/pengurusan/laporan-aset', 'list', 'Laporan'], ['/pengurusan/laporan', 'pdf', 'Eksekutif'], ['/notifikasi', 'bell', 'Notifikasi'], ['/profil', 'user', 'Profil']] : null);
  KD.extraNav.admin.push(['/admin/perancangan', 'sparkle', 'Perancangan'], ['/admin/laporan-aset', 'chart', 'Laporan aset'], ['/admin/import-aset', 'download', 'Import aset'], ['/admin/sistem', 'activity', 'Statistik sistem']);
})(window.KD);
</script>
