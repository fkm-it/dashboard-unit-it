<style>
/* ===== Dashboard Unit IT: Executive Overview + Import aset ===== */
.xo-kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--sp-4); }
.xo-kpi { display: flex; gap: var(--sp-3); align-items: flex-start; padding: var(--sp-5); background: var(--white); border: 1px solid var(--line); border-radius: var(--r-lg); color: inherit; text-decoration: none; transition: box-shadow .15s, border-color .15s; min-width: 0; }
.xo-kpi:hover { border-color: var(--line-strong); box-shadow: var(--shadow-lift); }
.xo-kpi:focus-visible { outline: none; box-shadow: var(--focus); }
.xo-kpi__ic { flex: none; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: #fff; }
.xo-kpi__ic .i { width: 22px; height: 22px; }
.xo-kpi__label { font-size: var(--fs-sm); font-weight: 600; color: var(--ink); }
.xo-kpi__value { white-space: nowrap; font-size: clamp(1.15rem, 1.55vw, var(--fs-2xl)); font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--ink); line-height: 1.15; margin-top: 2px; }
.xo-kpi__note { font-size: var(--fs-xs); color: var(--muted); margin-top: 2px; }
.xo-blue { background: #2563EB; } .xo-green { background: #15803D; } .xo-violet { background: #7C3AED; } .xo-amber { background: #D97706; } .xo-red { background: #DC2626; }
.xo-kpi--alert { border-color: #FECACA; background: #FFF7F7; }
.xo-grid4 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-4); margin-top: var(--sp-4); }
.xo-grid2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: var(--sp-4); margin-top: var(--sp-4); }
.xo-grid2 > .panel { min-width: 0; }
.xo-wide .hbar { grid-template-columns: minmax(130px, 210px) 1fr 44px; }
.xo-big { font-size: var(--fs-3xl); font-weight: 700; letter-spacing: -.02em; color: var(--ink); line-height: 1; }
.xo-grid3 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-4); margin-top: var(--sp-4); }
.xo-grid4 > .panel, .xo-grid3 > .panel { min-width: 0; }
.xo-donut { display: flex; flex-direction: column; align-items: center; gap: var(--sp-4); }
.xo-donut svg { width: 150px; height: 150px; flex: none; }
.xo-donut__c { font-size: 22px; font-weight: 700; fill: var(--ink); }
.xo-donut__s { font-size: 10px; fill: var(--muted); }
.xo-legend { display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-sm); min-width: 0; width: 100%; }
.xo-legend > span { display: flex; align-items: center; gap: 8px; }
.xo-legend i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.xo-legend b { margin-left: auto; padding-left: var(--sp-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.xo-table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
.xo-table th { text-align: left; font-weight: 600; color: var(--muted); font-size: var(--fs-xs); padding: 6px 4px; border-bottom: 1px solid var(--line); }
.xo-table td { padding: 8px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
.xo-table td.num, .xo-table th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.xo-table a { color: inherit; text-decoration: none; font-weight: 600; }
.xo-table a:hover { color: var(--brand); }
.xo-issue { display: flex; gap: var(--sp-3); align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
.xo-issue:last-child { border-bottom: 0; }
.xo-issue .i { flex: none; margin-top: 2px; }
.xo-issue--danger .i { color: var(--danger); } .xo-issue--warn .i { color: var(--warn); }
.xo-meter { margin-bottom: var(--sp-4); }
.xo-meter__top { display: flex; justify-content: space-between; font-size: var(--fs-sm); margin-bottom: 6px; gap: var(--sp-3); }
.xo-meter__top b { font-variant-numeric: tabular-nums; }
.xo-meter__track { height: 8px; border-radius: 4px; background: var(--canvas-200); overflow: hidden; }
.xo-meter__fill { height: 100%; border-radius: 4px; background: var(--brand); }
.xo-meter__fill.is-ok { background: var(--success); } .xo-meter__fill.is-warn { background: #D97706; }
.xo-sample { display: inline-flex; gap: 6px; align-items: center; font-size: var(--fs-xs); color: var(--muted); }
.xo-toolbar { display: flex; gap: var(--sp-2); align-items: center; flex-wrap: wrap; }
.im-drop { border: 2px dashed var(--line-strong); border-radius: var(--r-lg); padding: var(--sp-8) var(--sp-5); text-align: center; background: var(--white); }
.im-drop.is-over { border-color: var(--brand); background: var(--brand-50); }
.im-steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-4); }
.im-step { background: var(--white); border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--sp-4); font-size: var(--fs-sm); }
.im-step b { display: block; margin-bottom: 4px; }
.im-scroll { overflow-x: auto; max-width: 100%; }
.im-scroll table { min-width: 560px; }
.lp-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: var(--sp-4); overflow-x: auto; }
.lp-tab { padding: 10px 14px; font-weight: 600; font-size: var(--fs-sm); color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; white-space: nowrap; }
.lp-tab.is-active { color: var(--brand); border-bottom-color: var(--brand); }
.lp-filters { display: flex; gap: var(--sp-2); flex-wrap: wrap; align-items: center; margin-bottom: var(--sp-4); }
.lp-filters .select { width: auto; min-width: 0; max-width: 100%; }
.lp-cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--sp-3); }
.lp-card { background: var(--white); border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--sp-4); min-width: 0; }
.lp-card b { display: block; font-size: var(--fs-xl); font-variant-numeric: tabular-nums; margin-top: 2px; }
.lp-card.is-danger { border-color: #FECACA; background: #FFF7F7; } .lp-card.is-warn { border-color: #FDE68A; background: #FFFBEB; }
.lp-chip { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--canvas-200); margin: 1px 2px 1px 0; white-space: nowrap; }
.lp-note { font-size: var(--fs-xs); color: var(--muted); margin-top: var(--sp-2); }
.tr-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-4); }
.tr-grid > .panel { min-width: 0; }
@media (max-width: 640px) { .tr-grid { grid-template-columns: 1fr; } }
.print-only { display: none; }
.ex-doc { max-width: 900px; margin: 0 auto; }
.ex-doc h3 { font-size: var(--fs-md); margin-bottom: var(--sp-2); color: var(--brand-900); }
@media print {
  .sidebar, .topbar, .bottomnav, .lp-filters, .lp-tabs, .no-print, .toast, .toasts { display: none !important; }
  .main, .content { margin: 0 !important; padding: 0 !important; overflow: visible !important; }
  body { background: #fff !important; }
  .panel, .lp-card { break-inside: avoid; box-shadow: none !important; }
  .print-only { display: block; }
  .im-scroll { overflow: visible !important; }
  .xo-table { font-size: 10px; }
  .ex-doc { border: 0 !important; padding: 0 !important; max-width: none; }
  .ex-doc h3 { break-after: avoid; }
}
@media (max-width: 1280px) { .xo-kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 1100px) { .xo-grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .xo-grid2 { grid-template-columns: 1fr; } }
@media (max-width: 900px) { .xo-grid3 { grid-template-columns: 1fr; } }
@media (max-width: 640px) {
  .xo-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-3); }
  .xo-kpi { padding: var(--sp-3); flex-direction: column; gap: var(--sp-2); }
  .xo-kpi__ic { width: 34px; height: 34px; border-radius: 10px; }
  .xo-kpi__ic .i { width: 18px; height: 18px; }
  .xo-kpi__value { font-size: 1.1rem; white-space: normal; overflow-wrap: anywhere; }
  .xo-grid4, .xo-grid2 { grid-template-columns: 1fr; }
  .xo-donut svg { width: 120px; height: 120px; }
  .im-steps { grid-template-columns: 1fr; }
  .lp-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>
<script>
(function (KD) {
  'use strict';
  const { html, raw, qs, on, fmtNum, fmtDate, toCsv, downloadText } = KD.utils;
  const { icon, toast, toastError, errorState, empty, skeletonStats, toneBadge, busy, confirm } = KD.ui;
  const C = KD.charts;

  const rm = (n) => 'RM ' + Number(n || 0).toLocaleString('ms-MY', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
  const pctTxt = (v) => (v === null || v === undefined ? '—' : Number(v).toLocaleString('ms-MY', { maximumFractionDigits: 1 }) + '%');
  const statusOf = (key, value) => ((KD.moduleOf(key) || {}).statuses || []).find((s) => s.value === value) || { label: value, tone: 'muted' };
  const PRI_TONE = { KRITIKAL: 'danger', TINGGI: 'warn', SEDERHANA: 'brand', RENDAH: 'muted' };
  const PRI_LABEL = { KRITIKAL: 'Kritikal', TINGGI: 'Tinggi', SEDERHANA: 'Sederhana', RENDAH: 'Rendah' };
  const TONE_COLOR = { success: '#15803D', brand: '#2563EB', warn: '#D97706', danger: '#DC2626', muted: '#94A3B8', info: '#0EA5E9' };

  const kpi = (href, color, ic, label, value, note, alert) => html`<a class="xo-kpi ${alert ? 'xo-kpi--alert' : ''}" href="#${href}">
      <span class="xo-kpi__ic ${color}">${icon(ic)}</span>
      <span style="min-width:0"><span class="xo-kpi__label">${label}</span><div class="xo-kpi__value">${value}</div>${note ? html`<div class="xo-kpi__note">${note}</div>` : ''}</span></a>`;

  /** Carta donat SVG dengan legenda (status aset). */
  function donut(items, total, centerLabel) {
    const R = 52, L = 2 * Math.PI * R;
    let off = 0;
    let arcs = '';
    items.filter((d) => d.value > 0).forEach((d) => {
      const len = total ? (d.value / total) * L : 0;
      arcs += '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="' + d.color + '" stroke-width="18" stroke-dasharray="' + len + ' ' + (L - len) + '" stroke-dashoffset="' + (-off) + '" transform="rotate(-90 70 70)"><title>' + KD.utils.esc(d.label) + ': ' + d.value + '</title></circle>';
      off += len;
    });
    if (!total) arcs = '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="#E2E8F0" stroke-width="18"/>';
    return html`<div class="xo-donut"><svg viewBox="0 0 140 140" role="img" aria-label="Status aset">${raw(arcs)}<text x="70" y="70" text-anchor="middle" class="xo-donut__c">${fmtNum(total)}</text><text x="70" y="88" text-anchor="middle" class="xo-donut__s">${centerLabel}</text></svg>
      <div class="xo-legend">${items.map((d) => html`<span><i style="background:${d.color}"></i>${d.label}<b>${fmtNum(d.value)} <span class="muted">(${total ? Math.round((d.value / total) * 100) : 0}%)</span></b></span>`)}</div></div>`;
  }

  const meter = (label, v, sub) => {
    const n = v === null || v === undefined ? 0 : Math.max(0, Math.min(100, v));
    const cls = n >= 95 ? 'is-ok' : n >= 60 ? '' : 'is-warn';
    return html`<div class="xo-meter"><div class="xo-meter__top"><span>${label}</span><b>${pctTxt(v)}</b></div><div class="xo-meter__track"><div class="xo-meter__fill ${cls}" style="width:${n}%"></div></div>${sub ? html`<div class="xs muted mt-1">${sub}</div>` : ''}</div>`;
  };

  // ================================================================ Executive Overview (/admin)
  const overview = {
    async render(el) {
      const thisYear = new Date().getFullYear();
      const years = [thisYear + 1, thisYear, thisYear - 1, thisYear - 2];
      let tahun = thisYear;
      el.innerHTML = html`<div class="page-head"><div><h1>Executive Overview</h1><p>Gambaran keseluruhan aset IT, helpdesk dan keperluan komputer makmal FKM.</p></div>
        <div class="xo-toolbar"><select class="select" data-tahun aria-label="Tahun penilaian makmal">${years.map((y) => html`<option value="${y}" ${y === tahun ? raw('selected') : ''}>Keperluan ${y}</option>`)}</select>
        <button class="btn btn-outline" data-act="reload">${icon('refresh')}Muat semula</button></div></div><div data-box>${skeletonStats(5)}<div class="mt-6">${skeletonStats(4)}</div></div>`.s;
      const box = qs('[data-box]', el);
      const load = async () => {
        box.innerHTML = html`${skeletonStats(5)}<div class="mt-6">${skeletonStats(4)}</div>`.s;
        try {
          const o = await KD.api.call('aset.overview', { tahun });
          box.innerHTML = view(o).s;
        } catch (err) { box.innerHTML = errorState(err, 'reload').s; }
      };
      on(el, 'click', '[data-act="reload"]', load);
      on(el, 'change', '[data-tahun]', (e) => { tahun = Number(e.target.value); load(); });
      load();
    }
  };

  const MON = ['Jan', 'Feb', 'Mac', 'Apr', 'Mei', 'Jun', 'Jul', 'Ogo', 'Sep', 'Okt', 'Nov', 'Dis'];
  const monthName = (k) => { const p = String(k).split('-'); return MON[Number(p[1]) - 1] + ' ' + p[0]; };
  const PENGESAHAN = ['AKTIF', 'MAKMAL', 'GUNA_SAMA', 'BERTUKAR_PENJAGA', 'TIDAK_DISAHKAN', 'PELUPUSAN', 'LUPUS_REKOD_AKTIF', 'BUKAN_KOMPUTER'];
  const PENGESAHAN_LABEL = { AKTIF: 'Aktif (penjaga)', MAKMAL: 'Penggunaan makmal', GUNA_SAMA: 'Guna sama', BERTUKAR_PENJAGA: 'Bertukar penjaga', TIDAK_DISAHKAN: 'Tidak dapat disahkan', PELUPUSAN: 'Dalam pelupusan', LUPUS_REKOD_AKTIF: 'Lupus, rekod aktif', BUKAN_KOMPUTER: 'Bukan aset komputer' };
  const SHORT = { PERLAHAN: 'Berfungsi, tidak memadai', PERLU_BAIKI: 'Perlu dibaiki' };

  const HEALTH_T = { BAIK: ['Baik', 'success'], SEDERHANA: ['Sederhana', 'warn'], KRITIKAL: ['Kritikal', 'danger'] };
  /** Panel: jumlah komputer bagi setiap makmal + status ringkas. */
  function pcLabPanel(k) {
    if (!k || !k.items || !k.items.length) return '';
    const j = k.jumlah;
    const mix = (i) => [i.desktop ? i.desktop + ' meja' : '', i.laptop ? i.laptop + ' riba' : '', i.workstation ? i.workstation + ' workstation' : ''].filter(Boolean).join(' · ');
    const opBar = (i) => { const p = i.pc ? Math.round((i.beroperasi / i.pc) * 100) : 0; return html`<div style="display:flex;align-items:center;gap:8px;min-width:110px"><div class="xo-meter__track" style="flex:1"><div class="xo-meter__fill ${p >= 90 ? 'is-ok' : p >= 70 ? 'is-warn' : ''}" style="width:${p}%;${p < 70 ? 'background:var(--danger)' : ''}"></div></div><span class="xs" style="min-width:58px;text-align:right">${fmtNum(i.beroperasi)} (${p}%)</span></div>`; };
    return html`<section class="panel mt-4"><div class="panel-head"><h3>Komputer ikut makmal</h3><span class="xs muted">${fmtNum(j.pc)} komputer · ${fmtNum(j.makmal)} makmal</span></div>
      <div class="im-scroll"><table class="xo-table" style="min-width:720px"><thead><tr><th>Makmal</th><th class="num">Komputer</th><th>Beroperasi</th><th class="num">Rosak</th><th class="num">Perlu ganti</th><th class="num">Umur purata</th><th>Indeks makmal</th></tr></thead>
      <tbody>${k.items.map((i) => html`<tr><td><a href="#/admin/aset?f_makmal=${i.id}">${i.label}</a>${i.tempat && i.tempat !== i.pc ? html`<div class="xs muted">Tempat komputer: ${fmtNum(i.tempat)}</div>` : ''}</td>
        <td class="num"><b>${fmtNum(i.pc)}</b><div class="xs muted">${mix(i)}</div></td><td>${opBar(i)}</td>
        <td class="num">${i.rosak ? html`<span style="color:var(--danger);font-weight:600">${fmtNum(i.rosak)}</span>` : '0'}</td>
        <td class="num">${i.perluGanti ? html`<span style="color:var(--warn);font-weight:600">${fmtNum(i.perluGanti)}</span>` : '0'}</td>
        <td class="num">${i.umurPurata === null ? '—' : i.umurPurata + ' thn'}${i.tahunTertua ? html`<div class="xs muted">tertua ${i.tahunTertua}</div>` : ''}</td>
        <td>${i.tahap ? html`${toneBadge((HEALTH_T[i.tahap] || [i.tahap])[0] + ' · ' + i.indeks, (HEALTH_T[i.tahap] || [])[1] || 'muted')}` : html`<span class="muted xs">—</span>`}</td></tr>`)}
        <tr><td><b>Jumlah</b></td><td class="num"><b>${fmtNum(j.pc)}</b></td><td>${opBar({ pc: j.pc, beroperasi: j.beroperasi })}</td><td class="num"><b>${fmtNum(j.rosak)}</b></td><td class="num"><b>${fmtNum(j.perluGanti)}</b></td><td></td><td></td></tr></tbody></table></div>
      <p class="xs muted mt-2">Komputer = komputer meja, riba dan workstation yang dipautkan ke makmal (tidak termasuk dilupus).${k.tanpaMakmal ? ' ' + fmtNum(k.tanpaMakmal) + ' komputer lain tidak dipautkan ke mana-mana makmal (pejabat / staf).' : ''}${k.makmalTanpaPc ? ' ' + fmtNum(k.makmalTanpaPc) + ' makmal belum ada komputer dalam daftar aset.' : ''} Klik nama makmal untuk senarai aset.</p></section>`;
  }

  /* Kesediaan Windows 11 & profil spesifikasi */
  function win11Panel(sp) {
    const w = sp.win11, tot = sp.jumlah;
    const seg = [
      ['Windows 11', w.sudah, '#15803D'], ['Win 10 · boleh naik taraf', w.layak, '#D97706'], ['Win 10 · perlu ganti (CPU tidak disokong)', w.perluGanti, '#DC2626'],
      ['Win 10 · CPU tidak diketahui', w.cpuTidakDiketahui, '#F59E0B'], ['Windows lama (7/8)', w.osLama, '#7F1D1D'], ['Tiada data OS', w.tiadaData, '#CBD5E1']
    ].filter((x) => x[1] > 0);
    const w10 = sp.os.W10 + sp.os.W_LAMA;
    return html`<section class="panel"><div class="panel-head"><h3>Kesediaan Windows 11</h3><span class="xs muted">${fmtNum(tot)} komputer</span></div>
      ${w10 ? html`<div class="xo-issue xo-issue--danger">${icon('alert', 'i-sm')}<span class="small"><b>${fmtNum(w10)} komputer</b> masih Windows 10 atau lebih lama. Sokongan keselamatan Windows 10 tamat <b>14 Okt 2025</b>.</span></div>` : ''}
      <div style="display:flex;height:14px;border-radius:7px;overflow:hidden;margin:12px 0 10px;background:var(--canvas-200)" role="img" aria-label="Taburan sistem operasi">${seg.map((x) => html`<span title="${x[0]}: ${x[1]}" style="width:${(x[1] / tot) * 100}%;background:${x[2]}"></span>`)}</div>
      <div class="xo-legend">${seg.map((x) => html`<span><i style="background:${x[2]}"></i>${x[0]}<b>${fmtNum(x[1])}</b></span>`)}</div>
      ${sp.w10Makmal.length ? html`<div class="im-scroll mt-4"><table class="xo-table" style="min-width:0"><thead><tr><th>Makmal (Windows 10)</th><th class="num">PC</th><th class="num">Naik taraf</th><th class="num">Ganti</th></tr></thead>
        <tbody>${sp.w10Makmal.slice(0, 6).map((m) => html`<tr><td>${m.label}</td><td class="num">${fmtNum(m.w10)}</td><td class="num">${fmtNum(m.layak)}</td><td class="num">${m.perluGanti ? html`<b style="color:var(--danger)">${fmtNum(m.perluGanti)}</b>` : '0'}</td></tr>`)}</tbody></table></div>` : ''}
      <div class="xo-grid3" style="margin-top:var(--sp-4)"><div><div class="label">RAM</div>${C.hbars(sp.ram.filter((r) => r.value), { title: 'RAM' })}</div>
        <div><div class="label">Pemproses</div>${C.hbars(sp.cpu.slice(0, 6), { title: 'Pemproses' })}</div></div>
      <p class="xs muted mt-2">Layak Windows 11 = Intel Core generasi 8 ke atas atau AMD Ryzen 2000 ke atas (keperluan CPU Microsoft). Data OS ada untuk ${fmtNum(sp.adaDataOs)} daripada ${fmtNum(tot)} komputer${sp.adaDataOs < tot ? ' — lengkapkan medan CPU/OS (import spesifikasi) untuk liputan penuh' : ''}.</p></section>`;
  }

  /* Kapasiti: komputer beroperasi berbanding keperluan (pengguna setiap sesi, jika tiada → tempat komputer) */
  function capacityPanel(k) {
    const rows = ((k && k.items) || []).map((i) => {
      const need = i.pengguna || i.tempat;
      return need ? Object.assign({}, i, { need, basis: i.pengguna ? 'pengguna/sesi' : 'tempat', diff: i.beroperasi - need }) : null;
    }).filter(Boolean).sort((a, b) => a.diff - b.diff);
    const kurang = rows.filter((r) => r.diff < 0);
    return html`<section class="panel"><div class="panel-head"><h3>Kapasiti makmal</h3><span class="xs muted">PC beroperasi berbanding keperluan</span></div>
      ${rows.length ? html`${kurang.length ? html`<p class="small" style="color:var(--danger)">${icon('alert', 'i-sm')} <b>${fmtNum(kurang.length)} makmal</b> kekurangan ${fmtNum(kurang.reduce((s2, r) => s2 - r.diff, 0))} komputer beroperasi.</p>` : html`<p class="small" style="color:var(--success)">${icon('check', 'i-sm')} Semua makmal cukup komputer beroperasi.</p>`}
        <div class="im-scroll mt-2"><table class="xo-table" style="min-width:0"><thead><tr><th>Makmal</th><th class="num">Beroperasi / perlu</th><th>Status</th></tr></thead><tbody>
